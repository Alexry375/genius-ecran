<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Version classique · Genius N7</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(100vw, calc(100dvh * 16 / 9)); height: min(100dvh, calc(100vw * 9 / 16)); object-fit: contain; }
  #n { position: fixed; right: 12px; bottom: 10px; font: 13px system-ui, sans-serif; color: #9a917c; opacity: .8; }
</style>
</head>
<body>
<img id="d" src="slide-01.jpg" alt="Diapositive 1">
<div id="n">1 / 16 · → ←</div>
<script>
(function () {
  var N = 16, i = 1, img = document.getElementById('d'), n = document.getElementById('n');
  for (var k = 2; k <= N; k++) { var p = new Image(); p.src = 'slide-' + String(k).padStart(2, '0') + '.jpg'; }
  function va(j) {
    i = Math.max(1, Math.min(N, j));
    img.src = 'slide-' + String(i).padStart(2, '0') + '.jpg'; img.alt = 'Diapositive ' + i;
    n.textContent = i + ' / ' + N + ' · → ←';
  }
  addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (['ArrowRight', ' ', 'PageDown', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); va(i + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].indexOf(e.key) >= 0) { e.preventDefault(); va(i - 1); }
    else if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      else document.exitFullscreen && document.exitFullscreen();
    }
  });
  addEventListener('pointerup', function (e) { if (e.pointerType === 'touch') va(e.clientX >= innerWidth / 2 ? i + 1 : i - 1); });
})();
</script>
</body>
</html>
