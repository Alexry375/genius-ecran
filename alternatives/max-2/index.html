<script>
(function () {

/* ════════════════════════════════════════════════════════════════════════
   0. DONNÉES DÉRIVÉES
   ════════════════════════════════════════════════════════════════════════ */
const D = window.SOIREE;
const EV = D.evenement;
const G = D.guests.filter(Boolean).slice(0, 5);
const NN = ' ';                       // espace fine insécable
const fr = s => String(s == null ? '' : s).replace(/ +([;:!?»])/g, NN + '$1');
const maj = s => String(s).split('AIn7').map(p => p.toLocaleUpperCase('fr-FR')).join('AIn7');   // « AIn7 » garde son n minuscule
const nomDe = g => (g && g.nom ? String(g.nom).trim() : '');
/* « Trois histoires qui se répondent. » : la phrase de la charte suit le nombre réel d’actes */
const NB = ['Une', 'Deux', 'Trois', 'Quatre', 'Cinq'][G.length - 1] || 'Trois';
const HISTOIRES = G.length > 1 ? NB + ' histoires qui se répondent.' : 'Une histoire.';
const H = D.horaires || {};
const heure = k => (D.horairesConfirmes && H[k]) ? String(H[k]) : '';

/* ════════════════════════════════════════════════════════════════════════
   1. HORLOGE, INTERPOLATIONS
   ════════════════════════════════════════════════════════════════════════ */
const T0 = performance.now();
let gele = null;                                   // temps figé (répétitions / captures)
const now = () => gele !== null ? gele : (performance.now() - T0) / 1000;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  lin: t => t,
  quintIo: t => t < .5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2,
};
class Val {                                   // une valeur animable, avec enchaînements (.puis)
  constructor(v) { this.v0 = v; this.segs = []; }
  get() {
    const t = now(); let v = this.v0;
    for (const s of this.segs) {
      if (t < s.t0) break;
      if (s.d <= 0 || t >= s.t0 + s.d) { v = s.b; continue; }
      v = s.a + (s.b - s.a) * s.e((t - s.t0) / s.d); break;
    }
    return v;
  }
  get b() { return this.segs.length ? this.segs[this.segs.length - 1].b : this.v0; }
  to(v, d = 0, delay = 0, e = E.io) { const c = this.get(); this.v0 = c; this.segs = [{ a: c, b: v, t0: now() + delay, d, e }]; return this; }
  puis(v, d = 0, delay = 0, e = E.io) {
    const l = this.segs[this.segs.length - 1], a = l ? l.b : this.v0, t0 = l ? l.t0 + l.d + delay : now() + delay;
    this.segs.push({ a, b: v, t0, d, e }); return this;
  }
}
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

/* ════════════════════════════════════════════════════════════════════════
   2. LA FAÇADE : géométrie, fenêtres, caméra
   Une façade de brique foraine, la nuit. Une fenêtre par acte, au même étage.
   ════════════════════════════════════════════════════════════════════════ */
const GEO = { DX: 440, DY: 420, HS: 100, C0: -6, R0: -3, COLS: 13, ROWS: 6 };
GEO.TOIT = GEO.R0 * GEO.DY - GEO.HS - 140;               // la corniche, au-dessus du dernier étage
const fen = [];
for (let r = 0; r < GEO.ROWS; r++) for (let c = 0; c < GEO.COLS; c++) {
  const col = GEO.C0 + c, row = GEO.R0 + r;
  fen.push({ col, row, x: col * GEO.DX, y: row * GEO.DY, base: new Val(0), cadre: new Val(0), prog: null, acte: -1,
            seed: hash(c * 31 + r * 7 + 1), teinte: hash(c * 13.7 + r * 5.3 + 9.1) });
}
const fenAt = (col, row) => fen[(row - GEO.R0) * GEO.COLS + (col - GEO.C0)];
const NA = G.length;
const actes = G.map((g, i) => { const w = fenAt(i - Math.floor((NA - 1) / 2), 0); w.acte = i; w.teinte = 0.5; return w; });
const centreActes = { x: actes.reduce((s, w) => s + w.x, 0) / NA, y: 0 };

const cam = { x: new Val(0), y: new Val(0), lz: new Val(Math.log(1)) };
const scene = { expo: new Val(0), amb: new Val(0.03), jour: new Val(0), bandes: new Val(0), fond: new Val(0), voile: new Val(0), mur: new Val(1), portee: new Val(1), plancher: new Val(0) };
function camNow() { return { x: cam.x.get(), y: cam.y.get(), z: Math.exp(cam.lz.get()) }; }
function camTo(x, y, z, d = 0, delay = 0, e = E.io, ez) {
  cam.x.to(x, d, delay, e); cam.y.to(y, d, delay, e); cam.lz.to(Math.log(z), d, delay, ez || e);
}
/* place le point monde (wx, wy) à l’écran en (sx, sy) avec le zoom z */
function cadrer(wx, wy, sx, sy, z) { return { x: wx - (sx - 960) / z, y: wy - (sy - 540) / z, z }; }
function versEcran(wx, wy, c) { return { x: 960 + (wx - c.x) * c.z, y: 540 + (wy - c.y) * c.z }; }

/* programmes lumineux d’une fenêtre */
const CLES_ALLUMAGE = [[0, 0], [.07, .42], [.12, .05], [.24, .58], [.29, .16], [.43, .82], [.5, .5], [.7, 1], [1, 1]];
function courbe(keys, k) {
  if (k <= 0) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (k <= keys[i][0]) {
    const [a, va] = keys[i - 1], [b, vb] = keys[i]; return lerp(va, vb, (k - a) / (b - a));
  }
  return keys[keys.length - 1][1];
}
function allumer(w, t0, dur = 1.3, max = 1) {   // un tungstène qui chauffe : il hésite, puis tient
  const avant = w.prog ? 0 : w.base.get();
  w.prog = t => t < t0 ? avant : max * courbe(CLES_ALLUMAGE, (t - t0) / dur);
  w.base.to(max);
}
function eclat(w, t0) {                         // fenêtre déjà allumée : une respiration de lumière
  w.prog = t => { const k = (t - t0) / 1.6; return k <= 0 || k >= 1 ? 1 : 1 + 0.45 * Math.sin(Math.PI * k); };
  w.base.to(1);
}
function guetter(w) {                           // fenêtre éteinte : de temps en temps, quelqu’un frôle l’interrupteur
  w.prog = t => {
    const P = 7.3 + w.seed * 3, u = t / P + w.seed * 10, k = Math.floor(u), ph = u - k;
    if (hash(k * 3.1 + w.seed * 91) > 0.5) return 0;
    const p = (ph - 0.42) * P;
    if (p < 0 || p > 0.62) return 0;
    return p < 0.07 ? 0.13 : p < 0.15 ? 0.02 : p < 0.25 ? 0.09 : p < 0.33 ? 0.0 : p < 0.45 ? 0.06 : 0.0;
  };
  w.base.to(0);
}
function eteindre(w, d = 0) { w.prog = null; w.base.to(0, d); }
function fixer(w, v, d = 0) { w.prog = null; w.base.to(v, d); }
function intensite(w, t) {
  let v = w.prog ? w.prog(t) : w.base.get();
  if (v > 0.03) v *= 1 + 0.010 * Math.sin(t * 13.7 + w.seed * 40) + 0.007 * Math.sin(t * 29.3 + w.seed * 17);
  return clamp(v, 0, 1.5);
}

/* ════════════════════════════════════════════════════════════════════════
   3. RENDU WEBGL — brique, lumière, or, aube crème
   ════════════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
const VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
const FS = `
precision highp float;
uniform vec2 uRes; uniform vec3 uCam; uniform float uTime;
uniform sampler2D uWin; uniform vec4 uGrid; uniform vec3 uGeo;
uniform float uAmb; uniform float uExpo; uniform float uJour; uniform float uMur; uniform float uToit; uniform float uPortee;
uniform vec2 uJourC;

float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h12(i), h12(i+vec2(1.0,0.0)), f.x), mix(h12(i+vec2(0.0,1.0)), h12(i+vec2(1.0,1.0)), f.x), f.y); }
vec4 fen(vec2 c){ vec2 uv = (c - uGrid.xy + 0.5) / uGrid.zw;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) return vec4(0.0); return texture2D(uWin, uv); }

void main(){
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);

   ════════════════════════════════════════════════════════════════════════ */
const fonds = G.map(() => ({ ok: false, kind: null, el: null }));
function candidats(p) {
  if (!p) return [];
  const m = String(p).match(/^(.*?)(\.[a-z0-9]+)?$/i), base = m[1], ext = (m[2] || '').toLowerCase();
  const l = [p]; ['.jpg', '.jpeg', '.png', '.webp', '.mp4', '.webm'].forEach(e => { if (e !== ext) l.push(base + e); });
  return l;
}
function essayer(i, l, k) {
  if (k >= l.length || fonds[i].ok) return;
  const src = l[k];
  if (/\.(mp4|webm)$/i.test(src)) {
    const v = document.createElement('video'); v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
    v.addEventListener('loadeddata', () => { if (!fonds[i].ok) fonds[i] = { ok: true, kind: 'video', el: v }; }, { once: true });
    v.addEventListener('error', () => essayer(i, l, k + 1), { once: true });
    v.src = src;
  } else {
    const im = new Image();
    im.onload = () => { if (!fonds[i].ok) fonds[i] = { ok: true, kind: 'img', el: im }; };
    im.onerror = () => essayer(i, l, k + 1);
    im.src = src;
  }
}
G.forEach((g, i) => essayer(i, candidats(g.fond), 0));
let fondActif = -1;
function montrerFond(i, ctx, delay = 0.5) {
  const f = fonds[i];
  fondEl.innerHTML = ''; fondActif = i;
  fondEl.appendChild(f.el);
  if (f.kind === 'video') { try { f.el.currentTime = 0; f.el.play(); } catch (e) {} }
  scene.fond.to(1, ctx.T(1.6), ctx.D(delay), E.io);
}
function cacherFond(ctx, d = 1.0) {
  scene.fond.to(0, ctx.T(d), 0, E.io);
  const i = fondActif;
  if (i >= 0 && fonds[i] && fonds[i].kind === 'video') setTimeout(() => { if (fondActif !== i) try { fonds[i].el.pause(); } catch (e) {} }, 1200);
  fondActif = -1;
}

  }
  /* tout doit tenir au-dessus de la ligne des fauteuils (y ≈ 940) */
  requestAnimationFrame(() => { const h = box.scrollHeight, dispo = 940 - 336; if (h > dispo) box.style.transform = `scale(${(dispo / h).toFixed(3)})`; });
});

/* APÉRO — la conversation continue ───────────────────────────────────── */
ecran('apero', 'Apéro · rencontres', ctx => {
  cacherFond(ctx); scene.jour.to(1, ctx.T(1.2)); scene.bandes.to(0, ctx.T(1.2));
  etatActes(G.map((g, i) => i), ctx, false);
  const L = nouveauCalque('creme-txt');
  const m = marque(L, true); fondu(m, ctx, 0.2, 0.8);
  const p = piedDePage(L, true); fondu(p, ctx, 0.2, 0.8);
  /* le lieu, le plus grand possible, sur une ou deux lignes */
  const lieu = String(D.apero.lieu || '').trim();
  let lignes = [lieu], T = ajuster(lignes, 780, -0.035, 1380, 230);
  if (T < 180) { const dec = decouperNom(lieu); if (dec.length === 2) { const T2 = ajuster(dec, 780, -0.035, 1380, 230); if (T2 > T + 8) { lignes = dec; T = T2; } } }
  const precision = String(D.apero.precision || '').trim();
  const det = ['Buffet · rencontres'];
  if (heure('apero')) det.push('dès ' + heure('apero'));
  const hBloc = 32 + 40 + 0.1 * T + (lignes.length - 1) * 0.9 * T + 0.81 * T + 62 + 56 + (precision ? 64 : 0) + 46 + 64;
  let y = Math.max(150, Math.round((1080 - hBloc) / 2));
  const s = pos(el('div', 't sur', L, maj('La conversation continue')), 164, y, { color: '#7E6527', fontSize: '32px' }); apparait(s, ctx, 0.8, 1.1, 10);
  y += 32 + 40 + Math.round(0.1 * T);
  const fl = pos(el('div', 't titre', L, '→'), 150, y, { fontSize: T + 'px', color: '#D3B25B', fontWeight: 600 });
  apparait(fl, ctx, 1.1, 1.1, 0);
  const respire = anim(fl, [{ transform: 'translateX(0)' }, { transform: 'translateX(26px)' }, { transform: 'translateX(0)' }], 2.6, 2.4, 'ease-in-out');
  respire.effect.updateTiming({ iterations: Infinity });
  const xL = 150 + Math.round(T * 1.22);
  lignes.forEach((ln, k) => {
    const tl = pos(el('div', 't titre', L), xL, y + Math.round(k * 0.9 * T), { fontSize: T + 'px', color: '#0B0B0B' });
    allumeTexte(tl, ln, ctx, 1.3 + k * 0.3, 0.05);
  });
  y += Math.round((lignes.length - 1) * 0.9 * T + 0.81 * T + 62);
  const li = pos(el('div', 't ligne', L, det.join(' · ')), xL + 4, y, { color: 'rgba(11,11,11,.62)', fontSize: '46px' }); apparait(li, ctx, 2.2, 1.2, 10);
  y += 56;
  if (precision) { const pr = pos(el('div', 't ligne', L, fr(precision)), xL + 4, y + 8, { color: 'rgba(11,11,11,.62)', fontSize: '40px' }); apparait(pr, ctx, 2.5, 1.2, 10); y += 64; }
  /* les fenêtres de la soirée, devenues des carrés d’or (comme le carré N7 de la charte) */
  y += 46;
  G.forEach((g, i) => {
    const c = pos(el('div', null, L), xL + 4 + i * 92, y, { position: 'absolute', width: '64px', height: '64px', background: '#D3B25B' });
    const b = el('b', null, c, g.acte); Object.assign(b.style, { position: 'absolute', left: 0, right: 0, top: '8px', textAlign: 'center', fontWeight: 760, fontSize: '15px', color: '#0B0B0B' });
    apparait(c, ctx, 2.8 + i * 0.18, 0.9, 6);
  });
});

/* ════════════════════════════════════════════════════════════════════════
   9. RÉGIE : navigation clavier, noir, plein écran, aide
   ════════════════════════════════════════════════════════════════════════ */
let courant = -1;
function aller(n, mode) {
  n = clamp(n, 0, ECRANS.length - 1);
  const dir = n >= courant ? 1 : -1;
  const ctx = new Ctx(mode || (dir > 0 ? 'full' : 'quick'), dir);
  if (ECRANS[courant] && ECRANS[courant].id === 'attente' && ECRANS[n].id !== 'attente') Attente.arreter();
  viderCalques(ctx);
  courant = n;
  scene.mur.to(1, ctx.T(1.4)); scene.portee.to(1, ctx.T(1.4)); scene.plancher.to(0, ctx.T(1.4));   // chaque écran peut ensuite assombrir le mur
  ECRANS[n].entrer(ctx);
  majAide();
  try { history.replaceState(null, '', '#' + ECRANS[n].id); } catch (e) {}
}
const suivant = () => { if (courant < ECRANS.length - 1) aller(courant + 1); };
const precedent = () => { if (courant > 0) aller(courant - 1); };
let saisie = '', pret = false;                       // pas de navigation avant que l’écran soit prêt (polices chargées)
document.addEventListener('keydown', e => {
  const k = e.key;
  if (!pret) { e.preventDefault(); return; }
  if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !e.shiftKey) || k === 'ArrowDown') { e.preventDefault(); saisie = ''; suivant(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || (k === ' ' && e.shiftKey) || k === 'ArrowUp' || k === 'Backspace') { e.preventDefault(); saisie = ''; precedent(); }
  else if (k === 'b' || k === 'B' || k === '.') { scene.voile.to(scene.voile.b > 0.5 ? 0 : 1, 0.8); }
  else if (k === 'f' || k === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen && document.exitFullscreen(); }
  else if (k === 'h' || k === 'H' || k === '?') { const a = $('aide'); a.style.display = a.style.display === 'block' ? 'none' : 'block'; }
  else if (k === 'Home') { aller(0, 'quick'); }
  else if (k === 'End') { aller(ECRANS.length - 1, 'quick'); }
  else if (/^[0-9]$/.test(k)) { saisie += k; }
  else if (k === 'Enter' && saisie) { aller(parseInt(saisie, 10), 'quick'); saisie = ''; }
});
function majAide() {
  const a = $('aide');
  a.innerHTML = '<b>RÉGIE</b> &nbsp;→ / espace : suivant · ← : précédent · B : noir · F : plein écran · H : cette aide · numéro + Entrée : aller à<br><br>' +
    ECRANS.map((s, i) => `<div class="c${i === courant ? ' on' : ''}">${i} · ${s.label}</div>`).join('') +
    '<br><span class="c">Fonds : ' + G.map((g, i) => 'Acte ' + g.acte + (fonds[i].ok ? ' ✓' : ' — emplacement sobre')).join(' · ') + '</span>';
}

/* ════════════════════════════════════════════════════════════════════════
   10. MISE À L’ÉCHELLE ET BOUCLE
   ════════════════════════════════════════════════════════════════════════ */
function echelle() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener('resize', echelle); echelle();
const voile = $('voile');
function boucle() {
  const t = now();
  Attente.maj(t);
  rendre(t);
  placerEtiquettes();
  const b = scene.bandes.get();
  bandeH.style.transform = `translateY(${(-138 * (1 - b)).toFixed(2)}px)`;
  bandeB.style.transform = `translateY(${(138 * (1 - b)).toFixed(2)}px)`;
  fondEl.style.opacity = scene.fond.get().toFixed(3);
  voile.style.opacity = scene.voile.get().toFixed(3);
  if (gele === null) requestAnimationFrame(boucle);
}

/* paramètres de répétition : index.html?ecran=4&t=6 ouvre l’écran 4 figé à 6 s */
const P = new URLSearchParams(location.search);
function demarrer() {
  if (pret) return;
  pret = true;
  let n = 0;
  const h = (location.hash || '').slice(1);
  if (P.has('ecran')) n = parseInt(P.get('ecran'), 10) || 0;
  else if (h) { const k = ECRANS.findIndex(s => s.id === h); if (k >= 0) n = k; }
  if (P.has('t')) {
    const t = parseFloat(P.get('t')) || 0;
    aller(n, 'full');
    gele = now() + t;
    document.getAnimations().forEach(a => { try { a.pause(); a.currentTime = t * 1000 + (a.currentTime || 0); } catch (e) {} });
    for (let i = 0; i < 2; i++) { Attente.maj(gele); }
    document.getAnimations().forEach(a => { try { a.pause(); } catch (e) {} });
    boucle();
  } else {
    aller(n, n === 0 ? 'full' : 'quick');
    requestAnimationFrame(boucle);
  }
}
const polices = document.fonts ? Promise.all([
  document.fonts.load('780 100px "Inter N7"'), document.fonts.load('italic 460 100px "Inter N7"'),
].map(p => p.catch(() => null))).then(() => document.fonts.ready) : Promise.resolve();
polices.then(() => setTimeout(demarrer, 30), () => setTimeout(demarrer, 30));
setTimeout(demarrer, 3000);                          // filet : l’écran démarre même si une police tarde
window.__ecrans = ECRANS.map((s, i) => i + ' ' + s.id);
})();
</script>
