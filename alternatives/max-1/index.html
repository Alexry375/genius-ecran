/* ── 1 · ATTENTE ─ le filament couve, les phrases en sortent ───────────── */
function construireAttente() {
  const E = ecran('attente', 'Attente (boucle)', { boucle: true, fondu: 1.2, retard: 0, heure: D.horaires && D.horaires.accueil });
  const r = E.root;
  pied(r);
  const LY = 736, X = M, ZW = 1170;
  const plans = [];
  const ajout = o => plans.push(o);
  ajout({ sur: D.evenement.surtitre, lignes: D.evenement.titre.map(caps), sous: `${D.evenement.date} · ${D.evenement.lieu}`, h: .5, max: 156 });
  ajout({ sur: 'CE SOIR', lignes: ['TROIS HISTOIRES', 'QUI SE RÉPONDENT.'], sous: 'Un show narratif, puis du réseau.', h: .56, max: 150 });
  const caches = [];
  D.guests.forEach((g, i) => {
    if (nomDe(i) && !g.surprise) ajout({ sur: `ACTE ${ROM[i]}`, lignes: nomLignes(nomDe(i)), sous: g.ligne || '', h: .9, max: 190, allume: true });
    else caches.push(i);
  });
  if (caches.length) {
    const lab = caches.length === 1 ? `ACTE ${ROM[caches[0]]}` : caches.length === 2 ? `ACTES ${ROM[caches[0]]} ET ${ROM[caches[1]]}` : 'ACTES I, II ET III';
    const sous = caches.length === 1 ? 'Un nom. Il s’allume sur scène.' : `${caches.length === 2 ? 'Deux' : 'Trois'} noms. Ils s’allument sur scène.`;
    ajout({ sur: lab, lignes: ['SOUS', 'TENSION.'], sous, h: .26, max: 190, tension: caches.length });
  }
  if (D.horaires && D.horaires.ouverture) ajout({ sur: 'MISE SOUS TENSION', lignes: [D.horaires.ouverture], sous: 'Prends place.', h: .62, max: 300, horaire: true });
  ajout({ sur: 'ENSUITE', lignes: ['LA CONVERSATION', 'CONTINUE.'], sous: `Buffet · rencontres · ${lieuApero().phrase}`, h: .7, max: 150 });
  const parts = (D.partenaires || []).filter(p => p && p.logo);
  if (parts.length) ajout({ sur: 'AVEC LE SOUTIEN DE', lignes: [], sous: parts.map(p => p.nom).filter(Boolean).join(' · '), h: .6, partenaires: parts });

  plans.forEach(p => {
    p.haut = masque(r, X, 0, ZW + 200, LY - 14, true);
    p.sw = el('div', 'sur', p.haut, esc(p.sur));
    p.sw.style.marginBottom = '30px';
    if (p.partenaires) {
      const rang = el('div', '', p.haut); Object.assign(rang.style, { display: 'flex', gap: '56px', alignItems: 'center', height: '170px', marginBottom: '26px' });
      p.partenaires.forEach(pa => {
        const img = new Image(); img.src = pa.logo; img.alt = pa.nom || '';
        img.className = 'partlogo' + (pa.carte ? '' : ' silhouette');
        if (pa.carte) { const c = el('div', 'partcarte', rang); c.appendChild(img); } else rang.appendChild(img);
      });
      p.tb = { spans: [] }; p.w = 600;
    } else {
      p.tb = bloc(p.haut, 'titre', p.lignes);
      p.tb.style.paddingBottom = '.07em';
      ajuste(p.tb, ZW, p.max);
      p.tb.style.setProperty('--sw', p.tension ? '6px' : '4px');
      p.w = largeur(p.tb);
    }
    p.bas = masque(r, X, LY + 12, ZW + 200, 120, false);
    p.ss = el('div', 'sous', p.bas, esc(p.sous)); p.ss.style.paddingTop = '22px';
    p.haut.style.transform = 'translateY(105%)';
    p.bas.style.transform = 'translateY(-105%)';
    p.tb.spans.forEach(s => lettreChauffe(s, p.allume || p.tension ? 0 : 1));
  });
  const filA = new Fil(r, false, 5), filB = new Fil(r, false, 5);
  // carte QR
  const qr = el('div', 'carteqr', r, `${qrSVG(D.luma, 14)}<div class="appel">SCANNE · INSCRIS-TOI</div><div class="url">${esc(D.lumaCourt)}</div>`);
  qr.style.right = px(M); qr.style.bottom = px(H - LY - 2);

  const P = Math.max(5, +D.dureePlan || 8), N = plans.length, CYCLE = P * N;
  const montee = 1.25, descente = 1.0;
  let derniereMinute = null;
  E.plans = plans; E.P = P;
  E.frame = t => {
    const tc = ((t % CYCLE) + CYCLE) % CYCLE;
    const k = Math.floor(tc / P), u = tc - k * P;
    const p = plans[k], q = plans[(k - 1 + N) % N];
    // texte qui sort du filament / y retourne
    plans.forEach((pl, j) => {
      let y;
      if (j === k) {
        const inn = expoOut(seg(u, .15, .15 + montee)), out = easeIn(seg(u, P - descente, P - .05));
        y = (1 - inn) * 105 + out * 105;
        pl.haut.style.transform = `translateY(${y.toFixed(2)}%)`;
        pl.bas.style.transform = `translateY(${(-y).toFixed(2)}%)`;
        pl.haut.parentNode.style.visibility = pl.bas.parentNode.style.visibility = 'visible';
      } else {
        pl.haut.parentNode.style.visibility = pl.bas.parentNode.style.visibility = 'hidden';
      }
    });
    // lettres : allumage du nom, tension
    if (p.allume) p.tb.spans.forEach((s, i) => lettreChauffe(s, seg(u, .9 + i * .055, 2.2 + i * .055)));
    if (p.tension) p.tb.spans.forEach((s, i) => {
      const b = bruit(t * 1.6 + i * 3.1), surge = Math.pow(Math.max(0, Math.sin(t * 1.9 + i * .15)), 14);
      lettreChauffe(s, .03 + .12 * b + .14 * surge);
    });
    if (p.horaire && D.compteARebours) {
      const m = minutesAvant(D.horaires.ouverture);
      if (m !== derniereMinute) {
        derniereMinute = m;
        p.ss.textContent = m === null ? 'Prends place.' : m > 1 ? `Prends place : on commence dans ${m} minutes.` : m === 1 ? 'Prends place : on commence dans une minute.' : 'Prends place : on commence dans un instant.';
      }

    // le filament : longueur et chaleur glissent d'un plan à l'autre
    const tr = smooth(seg(u, 0, 1.1));
    const w0 = q.tension ? q.w : q.w, w1 = p.w;
    const breath = .035 * Math.sin(t * 1.15) + .03 * (bruit(t * .8) - .5);
    let h = lerp(q.h, p.h, tr) + breath;
    let L = lerp(w0, w1, tr);
    const sortie = seg(u, P - descente, P - .05), entree = seg(u, .05, .9);
    const intensite = .55 + .45 * Math.min(smooth(entree), 1 - .6 * smooth(sortie));
    h *= intensite;
    if (p.allume) h = lerp(h, .9 + .03 * Math.sin(t * 2), smooth(seg(u, .9, 2.0)) * (1 - sortie));
    const split = p.tension && p.tension > 1 ? smooth(seg(u, .3, 1.2)) * (1 - smooth(sortie)) : 0;
    if (split > 0) {
      const gap = 48 * split, L2 = (L - gap) / 2;
      const f1 = .22 + .14 * bruit(t * 2.3) + .1 * Math.pow(Math.max(0, Math.sin(t * 1.9)), 14);
      const f2 = .22 + .14 * bruit(t * 2.3 + 17) + .1 * Math.pow(Math.max(0, Math.sin(t * 1.9 + .8)), 14);
      filA.pose(X, LY, L2).chauffe(lerp(h, f1, split));
      filB.pose(X + L2 + gap, LY, L2).chauffe(lerp(h, f2, split), split);
    } else {
      filA.pose(X, LY, L).chauffe(h);
      filB.chauffe(0, 0);
    }

}
function minutesAvant(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim()); if (!m) return null;
  let now = new Date();
  if (params.get('heure')) { const f = /^(\d{1,2}):(\d{2})$/.exec(params.get('heure')); if (f) { now = new Date(); now.setHours(+f[1], +f[2], 0, 0); } }
  const cible = new Date(now); cible.setHours(+m[1], +m[2], 0, 0);
  const diff = Math.ceil((cible - now) / 60000);
  if (diff > 59 || diff < -20) return null;   // trop tôt, ou bien après l'heure : pas de compte à rebours
  return Math.max(0, diff);
}

/* ── 2 · OUVERTURE ─ mise sous tension, l'ampoule s'allume ─────────────── */
function construireOuverture() {
  const E = ecran('ouverture', 'Ouverture · mise sous tension', { fondu: .01, retard: 0, fin: 11.4, heure: D.horaires && D.horaires.ouverture });

  const filC = new Fil(r, false, 5);

  const S = 432, LX = W - M - S, LY0 = 268;
  const logo = logoG(r, S); Object.assign(logo.style, { left: px(LX), top: px(LY0) });
  const cr1 = el('div', 'sur abs', r, 'GENIUS N7 PRÉSENTE'), cr2 = el('div', 'sur abs', r, 'AVEC AIn7');
  [cr1, cr2].forEach((c, i) => Object.assign(c.style, { left: 0, right: 0, textAlign: 'center', top: px(790 + i * 70), color: 'var(--creme)', fontSize: i ? '32px' : '40px', letterSpacing: '.42em', textIndent: '.42em', opacity: 0 }));
  // titre final
  const LYT = 700;
  const haut = masque(r, M, 0, 1240, LYT - 14, true);
  const sw = el('div', 'sur', haut, esc(D.evenement.surtitre)); sw.style.marginBottom = '34px';
  const tb = bloc(haut, 'titre', D.evenement.titre.map(caps)); tb.style.paddingBottom = '.07em';
  ajuste(tb, LX - M - 90, 148);
  const tw = largeur(tb);
  const bas = masque(r, M, LYT + 12, 1240, 120, false);
  const ss = el('div', 'sous', bas, esc(`${D.evenement.date} · ${D.evenement.lieu}`)); ss.style.paddingTop = '22px';

  E.frame = t0 => {
    const t = t0 - .8;   // la salle passe d'abord au noir

    const apparait = smooth(seg(t, .2, 1.2));
    const chauffe = easeIn(seg(t, 1.1, 3.0));
    const frappe = expoOut(seg(t, 2.95, 3.35));
    const refroidit = smooth(seg(t, 3.3, 4.6));
    const lc = lerp(150, 230, chauffe), L = lerp(lc, W + 400, frappe);
    filC.pose(W / 2 - L / 2, 562, L).chauffe(lerp(.3 + .04 * Math.sin(t * 5), 1, chauffe), apparait * (1 - refroidit));
    mst.style.opacity = (smooth(seg(t, .6, 1.5)) * (1 - smooth(seg(t, 2.85, 3.15)))).toFixed(3);
    mst.style.color = rgba(chaleur(lerp(.62, .95, chauffe)), 1);
    // 2. surtension : l'éclair
    eclair(.62 * Math.max(0, 1 - Math.abs(t - 3.12) / .22) + .5 * Math.exp(-Math.max(0, t - 3.2) * 2.6) * (t > 3.12 ? 1 : 0), W / 2, 562);
    // 3. l'ampoule G sort de l'éclair, se refroidit en blanc, le carré or se pose
    const g = seg(t, 3.0, 3.5), gc = smooth(seg(t, 3.3, 5.2));

    logo.svg.style.opacity = smooth(g).toFixed(3);
    logo.carre.style.opacity = smooth(seg(t, 4.3, 5.4)).toFixed(3);

    logo.style.boxShadow = `0 0 ${px(120)} ${rgba([232, 170, 96], .16 * smooth(seg(t, 4.6, 6)))}`;
    // 4. génériques d'ouverture

    tb.spans.forEach((s, i) => lettreChauffe(s, seg(t, 7.9 + i * .07, 9.3 + i * .07), smooth(seg(t, 7.7 + i * .07, 8.1 + i * .07))));

/* ── 3 · LE TABLEAU DES TROIS ACTES (programme, mercis, clôture) ───────── */
function construireTableau(id, nom, o) {
  const E = ecran(id, nom, { fin: o.fin || 5, heure: o.heure });
  const r = E.root;
  pied(r);
  // en-tête du tableau
  const haut = masque(r, M, 0, 1700, 352, true);
  const sw = el('div', 'sur', haut, esc(o.sur)); sw.style.marginBottom = '26px';
  const tb = bloc(haut, 'titre', o.lignes); tb.style.paddingBottom = '.05em';

  // colonnes
  const COLX = [M, M + 600, M + 1200], TY = 418, TH = 292, BASE = 742;
  const cols = [0, 1, 2].map(i => {
    const c = { i };
    c.tubes = Array.from({ length: i + 1 }, (_, j) => new Fil(r, true, 12).pose(COLX[i] + 6 + j * 54, TY, TH));
    c.base = new Fil(r, false, 4).pose(COLX[i], BASE, 440);
    c.allume = o.allumes[i];
    c.suivant = o.suivant === i;
    const passe = o.passes && o.passes[i];
    const nm = nomDe(i);
    c.etiq = el('div', 'etiquette abs', r, `ACTE ${ROM[i]}${c.suivant ? ' <span style="color:var(--creme);opacity:.85">· À SUIVRE</span>' : ''}`);
    Object.assign(c.etiq.style, { left: px(COLX[i]), top: px(BASE + 32) });
    let lignes, eteint = false;
    if (c.allume && nm) lignes = nomLignes(nm);
    else if (c.allume && passe) lignes = [ORD[i], 'HISTOIRE'];
    else { lignes = ['SOUS', 'TENSION']; eteint = true; c.allume = false; }
    c.eteint = eteint;
    c.nom = bloc(r, 'nomcol abs', lignes);
    Object.assign(c.nom.style, { left: px(COLX[i]), top: px(BASE + 82) });
    ajuste(c.nom, 470, 62);
    c.nom.style.webkitTextStrokeWidth = eteint ? '3.2px' : '2.4px';
    c.nom.spans.forEach(s => lettreChauffe(s, 0));
    return c;
  });
  const ordre = cols.filter(c => c.allume).map(c => c.i);
  const debut = i => .9 + ordre.indexOf(i) * (o.cascade || .55);
  E.frame = t => {
    const m = expoOut(seg(t, .1, 1.3));
    haut.style.transform = `translateY(${((1 - m) * 105).toFixed(2)}%)`;
    cols.forEach(c => {
      const tv = Math.min(1, smooth(seg(t, .2, 1.0)));

        c.tubes.forEach((tu, j) => tu.chauffe(h - .06 * (1 - seg(t, d + j * .12, d + .5 + j * .12)), tv));
        c.base.chauffe(lerp(.14, .74, smooth(seg(t, d + .3, d + 1.2))) + .015 * Math.sin(t * 1.1 + c.i * 2), tv);
        c.nom.spans.forEach((s, k) => lettreChauffe(s, seg(t, d + .35 + k * .05, d + 1.6 + k * .05), tv));

      }
      c.etiq.style.opacity = (tv * (c.allume ? 1 : .7)).toFixed(3);
    });
    if (o.final && ordre.length) {

    }

}

/* ── 4 · ENTRÉE D'UN ACTE ─ les tubes I, II, III et le nom s'allument ───── */

  const r = E.root;

  const LY = 790, ZW = 1190;
  const haut = masque(r, M, 0, ZW + 200, LY - 14, true);
  const sw = el('div', 'sur', haut, `ACTE ${ROM[i]}`); Object.assign(sw.style, { marginBottom: '36px', fontSize: '36px' });
  const pile = el('div', '', haut); pile.style.position = 'relative';
  const lignes = nm ? nomLignes(nm) : [ORD[i], 'HISTOIRE'];
  const tb = bloc(pile, 'titre', lignes); tb.style.paddingBottom = '.07em';

  }

  const bas = masque(r, M, LY + 12, ZW + 200, 130, false);
  const ss = el('div', 'sous', bas, esc(g.ligne || '')); ss.style.paddingTop = '24px';
  const fil = new Fil(r, false, 5);
  // tubes : le chiffre romain de l'acte, en lumière
  const n = i + 1, ecart = 74, cx = 1612;

  tb.spans.forEach(s => lettreChauffe(s, 0, 0));

  const T0 = revele ? 1.0 : 3.5;          // instant de l'allumage
  E.frame = t => {
    const vis = smooth(seg(t, .1, .8));
    sw.style.opacity = smooth(seg(t, .2, .9)).toFixed(3);
    haut.style.transform = 'translateY(0)';
    if (st) {
      const fuite = smooth(seg(t, T0 - .05, T0 + .2));
      st.spans.forEach((s, k) => {
        const tension = seg(t, .3, T0);
        const b = bruit(t * (1.5 + 3 * tension) + k * 2.9);
        const surge = Math.pow(Math.max(0, Math.sin(t * (2 + 3 * tension) + k * .2)), 10);
        let p = .03 + .12 * b + (.1 + .2 * tension) * surge;
        p = lerp(p, .58, smooth(seg(t, T0 - .15, T0 + .05)));
        lettreChauffe(s, p, vis * (1 - fuite));
      });
    }
    // le nom
    tb.spans.forEach((s, k) => {
      const d = T0 + .35 + k * .055;
      const a = revele ? smooth(seg(t, .5, 1.0)) : smooth(seg(t, T0 + .22, T0 + .5 + k * .02));
      lettreChauffe(s, seg(t, d, d + 1.3), a);
    });
    // les tubes
    tubes.forEach((tu, j) => {
      const d = T0 - .1 + j * .16;
      let h;
      if (t < d) {
        const tension = revele ? .2 : seg(t, .3, T0);
        const b = bruit(t * (1.4 + 3 * tension) + j * 5.1);
        const surge = Math.pow(Math.max(0, Math.sin(t * (2.1 + 2.5 * tension) + j)), 12);
        h = .12 + .1 * b + (.08 + .24 * tension) * surge;
      } else {
        const mont = easeIn(seg(t, d, d + .55)), red = smooth(seg(t, d + .55, d + 1.9));
        h = lerp(.2, 1, mont) - .14 * red + .012 * Math.sin(t * 1.3 + j);
      }
      tu.chauffe(h, vis);
    });
    if (!revele) eclair(.42 * Math.exp(-Math.max(0, t - T0 - .2) * 2.2) * smooth(seg(t, T0, T0 + .2)), M + tw / 2, 560);
    const fl = expoOut(seg(t, T0 + 1.0, T0 + 1.8));
    fil.pose(M, LY, tw * fl).chauffe(lerp(1, .74, smooth(seg(t, T0 + 1.5, T0 + 2.6))) + .015 * Math.sin(t * 1.2), fl > 0 ? 1 : 0);
    const sb = expoOut(seg(t, T0 + 1.7, T0 + 2.7));
    bas.style.transform = `translateY(${((1 - sb) * -105).toFixed(2)}%)`;
  };
  return E;
}

/* ── 5 · FOND D'UN GUEST ─ l'image de Tristan, ou un fond sobre ────────── */
function construireFond(i) {
  const g = D.guests[i] || {};
  const nm = nomDe(i);
  const E = ecran(`fond-${i + 1}`, `Fond acte ${ROM[i]} (pendant l'intervention)`, { fin: 1.5, fondu: 1.4, retard: .2 });
  const r = E.root;
  const repli = el('div', '', r); Object.assign(repli.style, { position: 'absolute', inset: 0 });
  const n = i + 1, ecart = 74, cx = 1612;
  const tubes = Array.from({ length: n }, (_, j) => new Fil(repli, true, 6, false).pose(cx + (j - (n - 1) / 2) * ecart - 3, 150, 790));
  const sig = el('div', 'signature abs', repli, `ACTE ${ROM[i]}${nm ? ' · ' + esc(caps(nm)) : ''}`); Object.assign(sig.style, { left: px(M), top: '1010px' });
  const sigFil = new Fil(repli, false, 3).pose(M, 990, 96);
  const img = el('img', 'fondimg', r); img.alt = '';
  E.image = null;
  const base = String(g.fond || '').trim();
  const essais = [];
  if (base) { essais.push(base); const m = base.match(/^(.*)\.(jpe?g|png|webp)$/i); if (m) ['jpg', 'jpeg', 'png', 'webp'].forEach(x => { const c = `${m[1]}.${x}`; if (!essais.includes(c)) essais.push(c); }); }
  const essai = k => {
    if (k >= essais.length) { E.manque = base || '(aucun fichier indiqué)'; return; }
    img.onload = () => { img.style.display = 'block'; repli.style.display = 'none'; E.image = essais[k]; E.manque = null; majRegie(); };
    img.onerror = () => essai(k + 1);
    img.src = essais[k];
  };
  E.manque = base || '(aucun fichier indiqué)';
  essai(0);
  E.frame = t => {
    if (E.image) return;
    const v = smooth(seg(t, 0, 1.2));
    tubes.forEach((tu, j) => tu.chauffe(.5 + .012 * Math.sin(t * .6 + j), .4 * v));
    sigFil.chauffe(.7, v);
  };
  return E;
}

/* ── 6 · GÉNÉRIQUE ─ les remerciements défilent, puis MERCI ────────────── */
function construireGenerique() {
  const E = ecran('generique', 'Remerciements (générique)', {});
  const r = E.root;
  const def = el('div', 'defile', r);
  const lignes = [];
  D.guests.forEach((g, i) => lignes.push([`Acte ${ROM[i]}`, nomDe(i) || `${ORD[i].charAt(0)}${ORD[i].slice(1).toLowerCase()} histoire`]));
  const gen = (D.generique || []).filter(l => l && l[0]);
  const parts = (D.partenaires || []).filter(p => p && p.logo);
  // les logos des partenaires s'insèrent juste avant la dernière ligne du générique
  gen.forEach((l, k) => { if (k === gen.length - 1 && parts.length) lignes.push(['Partenaires', null]); lignes.push(l); });
  if (!gen.length && parts.length) lignes.push(['Partenaires', null]);
  lignes.forEach(([role, qui]) => {
    const c = el('div', 'cr', def, `<span class="role">${esc(caps(role))}</span>`);
    if (qui === null) {
      const lg = el('div', 'logos', c);
      parts.forEach(pa => {
        const img = new Image(); img.onload = () => E.mesure && E.mesure(); img.src = pa.logo; img.alt = pa.nom || '';
        img.className = 'partlogo' + (pa.carte ? '' : ' silhouette');
        if (pa.carte) { const cc = el('span', 'partcarte', lg); cc.appendChild(img); } else lg.appendChild(img);
      });
    } else if (String(qui).trim()) {
      const q = el('span', 'qui', c, esc(qui));
      const w = q.offsetWidth; if (w > W - 2 * M) q.style.fontSize = Math.floor(76 * (W - 2 * M) / w) + 'px';
    }
  });
  // la fin : l'ampoule, allumée, et MERCI
  const finEl = el('div', '', r); Object.assign(finEl.style, { position: 'absolute', inset: 0, opacity: 0 });
  const S = 300;
  const logo = logoG(finEl, S); Object.assign(logo.style, { left: px(W / 2 - S / 2), top: '230px' });
  logo.svg.style.filter = `drop-shadow(0 0 10px ${rgba(chaleur(.9), .5)})`;
  logo.style.boxShadow = '0 0 120px rgba(232,170,96,.18)';
  const merci = bloc(finEl, 'titre abs', ['MERCI.']); Object.assign(merci.style, { left: 0, right: 0, top: '600px', textAlign: 'center' });
  merci.style.fontSize = '150px'; merci.querySelector('.ligne').style.margin = '0 auto';
  merci.spans.forEach(s => lettreChauffe(s, 1));
  const sig = el('div', 'sur abs', finEl, `GENIUS N7 · AIn7 · ${esc(D.evenement.dateCourte)}`); Object.assign(sig.style, { left: 0, right: 0, textAlign: 'center', top: '800px', fontSize: '26px', letterSpacing: '.36em', textIndent: '.36em' });
  const VIT = 60;   // pixels par seconde
  let hauteur = 0;
  // t1 : la dernière ligne arrive dans le tiers haut de l'écran, le générique s'efface, MERCI s'allume
  E.mesure = () => { hauteur = def.offsetHeight; E.t1 = (H + hauteur - 400) / VIT; E.fin = E.t1 + 2.8; };
  E.mesure();
  E.frame = t => {
    if (!hauteur) E.mesure();
    const t1 = E.t1;
    def.style.transform = `translateY(${px(H - t * VIT)})`;
    def.style.opacity = (1 - smooth(seg(t, t1, t1 + 1.2))).toFixed(3);
    finEl.style.opacity = smooth(seg(t, t1 + .4, t1 + 1.8)).toFixed(3);
    merci.spans.forEach((s, k) => lettreChauffe(s, lerp(.3, 1, seg(t, t1 + .5 + k * .08, t1 + 2.1 + k * .08))));
  };
  return E;
}

/* ── 7 · L'APÉRO ─ la conversation continue, que le courant passe ──────── */
function construireApero() {
  const E = ecran('apero', 'Envoi vers l’apéro (boucle)', { boucle: true, fin: 4, heure: D.horaires && D.horaires.apero });
  const r = E.root;
  pied(r);
  const LY = 668, ZW = 1500;
  const haut = masque(r, M, 0, ZW + 200, LY - 14, true);
  const sw = el('div', 'sur', haut, 'BUFFET · RENCONTRES'); sw.style.marginBottom = '34px';
  const tb = bloc(haut, 'titre', ['LA CONVERSATION', 'CONTINUE.']); tb.style.paddingBottom = '.07em';
  ajuste(tb, 1240, 170);
  tb.spans.forEach(s => lettreChauffe(s, 1));
  const lieu = lieuApero();
  const bas = masque(r, M, LY + 12, ZW + 200, 300, false);
  const pl = el('div', 'titre', bas); pl.style.paddingTop = '34px';
  pl.innerHTML = `<span class="ligne" style="color:var(--or)">${esc(caps(lieu.phrase))}</span>`;
  ajuste(pl, 1480, 104);
  if (D.apero.indication) { const ind = el('div', 'sous', bas, esc(D.apero.indication)); ind.style.paddingTop = '22px'; }
  const signe = el('div', 'sur abs', r, 'QUE LE COURANT PASSE.'); Object.assign(signe.style, { left: px(M), top: '936px', fontSize: '26px', color: 'var(--cuivre)' });
  // le fil devient flèche : le courant va vers la sortie
  const X1 = M, X2 = W - M - 8;
  const fil = new Fil(r, false, 5);
  const pointeA = new Fil(r, false, 5), pointeB = new Fil(r, false, 5);
  [pointeA, pointeB].forEach((p, k) => { p.e.style.transformOrigin = '100% 50%'; p.e.style.transform = `rotate(${k ? -36 : 36}deg)`; });
  const etincelles = [0, 1, 2].map(() => { const e = el('div', 'abs', r); Object.assign(e.style, { width: '90px', height: '18px', borderRadius: '50%', background: 'radial-gradient(closest-side,rgba(255,250,236,1),rgba(254,221,116,.7) 40%,rgba(254,221,116,0))', top: px(LY - 7), mixBlendMode: 'screen', opacity: 0 }); return e; });
  E.frame = t => {
    const m = expoOut(seg(t, .1, 1.3));
    haut.style.transform = `translateY(${((1 - m) * 105).toFixed(2)}%)`;
    const fl = expoOut(seg(t, .8, 2.0));
    const L = (X2 - X1) * fl;
    const h = .74 + .02 * Math.sin(t * 1.2);
    fil.pose(X1, LY, L).chauffe(h, fl > 0 ? 1 : 0);
    const pa = smooth(seg(t, 1.7, 2.2));
    pointeA.pose(X1 + L - 52, LY, 54).chauffe(h, pa); pointeB.pose(X1 + L - 52, LY, 54).chauffe(h, pa);
    const sb = expoOut(seg(t, 1.5, 2.6));
    bas.style.transform = `translateY(${((1 - sb) * -105).toFixed(2)}%)`;
    signe.style.opacity = smooth(seg(t, 2.4, 3.4)).toFixed(3);
    etincelles.forEach((e, k) => {
      const per = 2.6, u = ((t - 2.2 - k * per / 3) % per + per) % per / per;
      const x = X1 + (X2 - X1 - 40) * easeInOut(u);
      e.style.transform = `translateX(${px(x - 45)})`;
      e.style.opacity = t < 2.2 ? '0' : (Math.sin(Math.PI * u) * .95).toFixed(3);
    });
  };
  return E;
}

/* ═════════════════════════ LE DÉROULÉ ═════════════════════════════════════ */
function construire() {
  construireAttente();
  construireOuverture();
  const rev = i => !!nomDe(i) && !(D.guests[i] || {}).surprise;
  construireTableau('programme', 'Les trois actes (programme)', { sur: 'CE SOIR', lignes: ['TROIS HISTOIRES', 'QUI SE RÉPONDENT.'], allumes: [0, 1, 2].map(rev) });
  for (let i = 0; i < 3; i++) {
    construireActe(i);
    construireFond(i);
    if (i < 2) construireTableau(`merci-${i + 1}`, `Transition · merci acte ${ROM[i]}`, {
      sur: `ACTE ${ROM[i]}`, lignes: ['MERCI.'], tailleTitre: 150,
      allumes: [0, 1, 2].map(j => j <= i || rev(j)), passes: [0, 1, 2].map(j => j <= i), suivant: i + 1,
    });
  }
  construireTableau('cloture', 'Clôture · trois histoires', { sur: 'CE SOIR', lignes: ['TROIS HISTOIRES', 'QUI SE RÉPONDENT.'], allumes: [true, true, true], passes: [true, true, true], final: true, cascade: .8, fin: 5.4, heure: D.horaires && D.horaires.cloture });
  construireGenerique();
  construireApero();
}

/* ═════════════════════════ MOTEUR ════════════════════════════════════════ */
let idx = 0, tIn = 0, sortant = null, tSort = 0, fige = false, pauseT = null, rapide = false;
const now = () => performance.now();
function montrer(E, o) { E.root.style.visibility = 'visible'; E.root.style.opacity = o; }
function cacher(E) { E.root.style.visibility = 'hidden'; E.root.style.opacity = 0; }
function aller(i, mode = {}) {
  i = Math.max(0, Math.min(ECRANS.length - 1, i | 0));
  if (i === idx && !mode.force) return;
  if (sortant && sortant !== ECRANS[i]) cacher(sortant);
  sortant = (i !== idx) ? ECRANS[idx] : null; tSort = now();
  if (sortant) sortant.tGel = tempsDe(sortant);
  idx = i; rapide = !!mode.fige;
  tIn = now() - (rapide ? ECRANS[i].fin * 1000 : 0);
  montrer(ECRANS[i], 0);
  if (ECRANS[i].mesure) ECRANS[i].mesure();
  try { history.replaceState(null, '', '#' + ECRANS[i].id); } catch (e) { /* file:// sans historique */ }
  majRegie();
}
function tempsDe(E) { return E === ECRANS[idx] ? (pauseT !== null ? pauseT : (now() - tIn) / 1000) : (E.tGel || 0); }
const suivant = () => aller(idx + 1);
const precedent = () => aller(idx - 1, { fige: true });

function boucle() {
  const E = ECRANS[idx];
  const t = tempsDe(E);
  eclairDemande = 0; eclairX = 960; eclairY = 540;
  E.frame(t);
  let o;
  if (pauseT !== null) o = 1;
  else if (rapide) o = smooth(seg((now() - tIn) / 1000 - E.fin, 0, .45));
  else o = smooth(seg(t, E.retard, E.retard + E.fondu));
  E.root.style.opacity = o.toFixed(3);
  if (sortant) {
    const ts = (now() - tSort) / 1000;
    const dur = rapide ? .35 : (sortant.id === 'attente' ? 1.0 : .7);
    const os = 1 - smooth(seg(ts, 0, dur));
    if (os <= 0 || pauseT !== null) { cacher(sortant); sortant = null; }
    else sortant.root.style.opacity = os.toFixed(3);
  }
  eclairEl.style.opacity = clamp(eclairDemande).toFixed(3);
  const pos = `${eclairX | 0}px ${eclairY | 0}px`;
  if (pos !== eclairPos) { eclairPos = pos; eclairEl.style.setProperty('--ec', pos); }
  // sur l'image d'un guest : ni vignette ni grain, l'image reste telle quelle
  let brut = E.image ? o : 0;
  if (sortant && sortant.image) brut = Math.max(brut, parseFloat(sortant.root.style.opacity) || 0);
  if (Math.abs(brut - dernierBrut) > .002) {
    dernierBrut = brut;
    vignetteEl.style.opacity = (1 - brut).toFixed(3);
    grainEl.style.opacity = (.075 * (1 - brut)).toFixed(4);
  }
  requestAnimationFrame(boucle);
}
const vignetteEl = document.getElementById('vignette'), grainEl = document.getElementById('grain');
let dernierBrut = -1;

/* ── grain de pellicule ─────────────────────────────────────────────────── */
function grain() {
  const g = document.getElementById('grain');
  if (!D.grain) { g.style.display = 'none'; return; }
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), im = x.createImageData(256, 256);
  let s = 1234567;
  for (let k = 0; k < im.data.length; k += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const v = (s >> 8) & 255; im.data[k] = im.data[k + 1] = im.data[k + 2] = v; im.data[k + 3] = 255; }
  x.putImageData(im, 0, 0);
  g.style.backgroundImage = `url(${c.toDataURL()})`;
  if (CAPTURE) return;
  setInterval(() => { g.style.transform = `translate(${(Math.random() * 200 - 100) | 0}px,${(Math.random() * 200 - 100) | 0}px)`; }, 83);
}

/* ── régie ─────────────────────────────────────────────────────────────── */
const regie = document.getElementById('regie');
function majRegie() {
  if (regie.style.display !== 'block') return;
  const alertes = [];
  ECRANS.forEach(E => { if (E.manque) alertes.push(`Fond manquant : <b>${esc(E.manque)}</b> (fond sobre affiché)`); });
  D.guests.forEach((g, i) => { if (!nomDe(i)) alertes.push(`Acte ${ROM[i]} : nom vide (« sous tension » puis « ${ORD[i].toLowerCase()} histoire »)`); });
  alertes.push('Horaires à confirmer (objet SOIREE, en tête du fichier)');
  regie.innerHTML = `<h3>RÉGIE · ÉCRAN ${idx + 1} / ${ECRANS.length}</h3>
    <ol>${ECRANS.map((E, k) => `<li class="${k === idx ? 'actif' : ''}">${esc(E.nom)}${E.heure ? ` <span style="color:#9a9a9a">· ${esc(E.heure)}</span>` : ''}</li>`).join('')}</ol>
    <div><kbd>→</kbd> <kbd>Espace</kbd> avancer · <kbd>←</kbd> reculer · <kbd>R</kbd> rejouer l'écran<br>
    <kbd>B</kbd> noir · <kbd>F</kbd> plein écran · <kbd>H</kbd> fermer · <kbd>0</kbd>–<kbd>9</kbd> aller à l'écran (régie ouverte)</div>
    <p class="alerte">${alertes.map(a => '• ' + a).join('<br>')}</p>`;
}
function basculeRegie() { regie.style.display = regie.style.display === 'block' ? 'none' : 'block'; majRegie(); }

/* ── clavier ───────────────────────────────────────────────────────────── */
let verrou = null;
async function veille() { try { if (!verrou && navigator.wakeLock) verrou = await navigator.wakeLock.request('screen'); } catch (e) { /* pas grave */ } }
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  veille();
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'ArrowDown' || k === 'Enter') { e.preventDefault(); suivant(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp' || k === 'Backspace') { e.preventDefault(); precedent(); }
  else if (k === 'Home') { e.preventDefault(); aller(0, { fige: true }); }
  else if (k === 'End') { e.preventDefault(); aller(ECRANS.length - 1, { fige: true }); }
  else if (k === 'r' || k === 'R') aller(idx, { force: true });
  else if (k === 'b' || k === 'B' || k === '.') { const n = document.getElementById('noir'); n.style.opacity = n.style.opacity === '1' ? '0' : '1'; }
  else if (k === 'f' || k === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'h' || k === 'H' || k === '?') basculeRegie();
  else if (/^[0-9]$/.test(k) && regie.style.display === 'block') { const n = +k === 0 ? 9 : +k - 1; aller(n, { fige: true }); }
});
let minuteur = null;
addEventListener('mousemove', () => { document.body.classList.remove('cache-souris'); clearTimeout(minuteur); minuteur = setTimeout(() => document.body.classList.add('cache-souris'), 1800); });

/* ── mise à l'échelle (16:9 dans n'importe quelle fenêtre) ─────────────── */
function echelle() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  scene.style.transform = `translate(${px((innerWidth - W * s) / 2)},${px((innerHeight - H * s) / 2)}) scale(${s.toFixed(5)})`;
}
addEventListener('resize', echelle);
// adresse modifiée à la main (…/index.html#acte-2) : on y va
addEventListener('hashchange', () => { const k = ECRANS.findIndex(E => E.id === decodeURIComponent(location.hash.slice(1))); if (k >= 0 && k !== idx) aller(k, { fige: true }); });

/* ── démarrage ─────────────────────────────────────────────────────────── */
function demarrer() {
  echelle();
  try { construire(); }
  catch (e) { panne(`Erreur pendant la préparation des écrans : ${e && e.message}. Vérifier la dernière modification du bloc SOIREE, en haut de index.html.`); throw e; }
  grain();
  const h = decodeURIComponent((location.hash || '').slice(1));
  const k = ECRANS.findIndex(E => E.id === h);
  idx = -1;
  if (k > 0) { idx = 0; aller(k, { fige: true }); }
  else { idx = 0; montrer(ECRANS[0], 0); tIn = now(); }
  window.REGIE = {
    ecrans: ECRANS.map(E => E.id), aller: (i, f) => aller(i, { fige: !!f, force: true }),
    seek: t => { pauseT = t; }, reprendre: () => { pauseT = null; }, courant: () => idx,
    infos: () => ECRANS.map(E => ({ id: E.id, fin: E.fin, manque: E.manque || null })),
  };
  requestAnimationFrame(boucle);
}
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load('800 100px Inter'), document.fonts.load('500 40px Inter'), document.fonts.load('700 30px Inter')]).catch(() => {}) : Promise.resolve())
  .then(() => document.fonts ? document.fonts.ready : null).then(demarrer, demarrer);
})();
</script>
