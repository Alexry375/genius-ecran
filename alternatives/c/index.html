<style>
@font-face{font-family:"Inter";src:url("fonts/InterVariable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:block}

#cloture[data-step="1"] .apres .t b{animation:leve 1.3s 1.25s var(--out) both}
#cloture[data-step="1"] .apres .t span:nth-child(2) b{animation-delay:1.4s}
#cloture[data-step="1"] .apres .sur,#cloture[data-step="1"] .apres .chr{animation:fond 1s 1.6s both}

/* =====================================================================
   REMERCIEMENTS (crème)
   ===================================================================== */
#generique .chrome .mot{color:var(--nuit)}
#generique .mot-merci{position:absolute;left:62px;top:170px;font-size:250px}
#generique .grille{position:absolute;left:72px;right:72px;top:450px;display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:48px}
#generique .grille .sur{font-size:22px;color:#8a7433;margin-bottom:22px;letter-spacing:.3em}
#generique .grille p{font-size:44px;font-weight:750;line-height:1.2;letter-spacing:-.015em;white-space:nowrap}
#generique .grille p small{display:block;font-size:26px;font-weight:550;color:#6c675d;letter-spacing:0;margin-top:2px}
#generique .grille p.avec-logo{display:grid;grid-template-columns:auto 1fr;column-gap:18px;align-items:center;margin-bottom:10px}
#generique .grille p.avec-logo .eq-logo{grid-row:1 / span 2;height:68px;width:auto}
#generique .grille p.avec-logo small{grid-column:2}
#generique .grille .sceau{width:220px;height:40px;margin:6px 0 4px}
#generique .grille .sceau b{font-size:18px}
#generique .partenaires{position:absolute;left:72px;right:72px;top:770px}
#generique .partenaires .sur{font-size:22px;color:#8a7433;letter-spacing:.3em}
#generique .logos{display:flex;gap:28px;margin-top:22px}
#generique .logo{flex:1;height:120px;display:grid;place-items:center;border:2px dashed rgba(11,11,11,.22);color:#9a958a;font-size:18px;font-weight:650;letter-spacing:.24em;text-transform:uppercase}
#generique .logo.plein{border:0}
#generique .logo img{max-width:85%;max-height:84px;object-fit:contain}
#generique.actif .mot-merci{animation:monte 1.2s var(--out) both}
#generique.actif .grille>div{animation:monte 1.1s var(--out) both}
#generique.actif .grille>div:nth-child(2){animation-delay:.12s}
#generique.actif .grille>div:nth-child(3){animation-delay:.24s}
#generique.actif .grille>div:nth-child(4){animation-delay:.36s}
#generique.actif .partenaires{animation:fond 1.2s .7s both}

/* =====================================================================
   APÉRO (crème, en boucle)
   ===================================================================== */
#apero .chrome .mot{color:var(--nuit)}
#apero .sur.s1{position:absolute;left:72px;top:262px;color:#8a7433;font-size:30px;letter-spacing:.42em}
#apero .fleche{position:absolute;left:52px;top:330px;width:300px;height:300px}
#apero .lieu{position:absolute;left:400px;top:326px;font-size:236px}
#apero .lieu span{display:block;overflow:visible}
#apero .lieu.deux{font-size:196px;line-height:1.06}
#apero .lieu b{font-weight:inherit}
#apero .info{position:absolute;left:406px;top:640px;font-size:46px;font-weight:600;letter-spacing:-.01em;display:flex;gap:30px;align-items:center}
#apero .info i{display:block;width:14px;height:14px;background:var(--or)}
#apero .piste{position:absolute;left:0;right:0;top:880px;height:24px;overflow:hidden}
#apero .piste b{position:absolute;top:0;width:24px;height:24px;background:var(--or);left:-40px;animation:piste 4.8s linear infinite}
#apero.actif .lieu{animation:monte 1.3s .1s var(--out) both}
#apero.actif .fleche{animation:glisse 1.3s var(--out) both}
#apero.actif .fleche path{animation:pousse 2.6s 1.4s ease-in-out infinite}
#apero.actif .info{animation:fond 1.2s .8s both}

/* ---------- animations ---------- */
@keyframes fond{from{opacity:0}to{opacity:1}}
@keyframes monte{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes leve{from{transform:translateY(105%)}to{transform:none}}
@keyframes descend{from{transform:scaleY(0);transform-origin:top}to{transform:scaleY(1);transform-origin:top}}
@keyframes coule{from{top:-40%}to{top:110%}}
@keyframes trace{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ouvreX{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@keyframes leveSceau{0%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes inonde{0%{transform:scale(0);background:var(--or)}45%{transform:scale(1.2);background:var(--or)}100%{transform:scale(60);background:var(--creme)}}
@keyframes piste{from{left:-40px}to{left:1960px}}
@keyframes glisse{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes pousse{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}

/* ---------- surcouches ---------- */
#grain{position:absolute;inset:-60px;background:url("img/grain.png");opacity:.07;mix-blend-mode:overlay;pointer-events:none;z-index:50;animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-22px,14px)}40%{transform:translate(18px,-26px)}60%{transform:translate(-30px,-8px)}80%{transform:translate(12px,28px)}100%{transform:translate(0,0)}}
#volet{position:absolute;top:0;left:0;width:280px;height:1080px;background:var(--or);z-index:40;transform:translateX(-320px);
  box-shadow:0 0 120px 30px rgba(211,178,91,.35)}
#volet.passe{transition:transform .95s cubic-bezier(.65,0,.35,1);transform:translateX(2000px)}
#noir{position:absolute;inset:0;background:#000;z-index:45;opacity:0;pointer-events:none;transition:opacity .45s ease}
#noir.on{opacity:1}
#regie{position:absolute;left:24px;bottom:24px;z-index:60;background:rgba(0,0,0,.82);color:#e8e2d2;font:600 20px/1.45 Inter,Arial,sans-serif;
  padding:18px 24px;border-left:6px solid var(--or);display:none;max-width:1100px}
#regie.on{display:block}
#regie em{font-style:normal;color:var(--or)}
.sans-anim,.sans-anim *{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- G en ampoule de Genius (redessiné en vectoriel) -->
    <symbol id="g-ampoule" viewBox="-130 -125 260 260">
      <mask id="gm" maskUnits="userSpaceOnUse" x="-130" y="-130" width="260" height="260">
        <path d="M-80 60 A100 100 0 1 1 80 60 C66 74 46 76 40 90 L-40 90 C-46 76 -66 74 -80 60 Z" fill="#fff"/>
        <path d="M-56 35 A66 66 0 1 1 56 35 C46 47 24 50 20 64 L-20 64 C-24 50 -46 47 -56 35 Z" fill="#000"/>
        <path d="M0 0 L112 -88 L140 -4 L0 -4 Z" fill="#000"/>
        <path d="M26 -4 L99 -4 L97 21 L26 21 Z" fill="#fff"/>
        <path d="M40 20 L72 20 L48 50 Z" fill="#fff"/>
      </mask>
      <rect x="-130" y="-130" width="260" height="260" fill="currentColor" mask="url(#gm)"/>
      <rect x="-30" y="99" width="60" height="16" rx="8" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
<div id="stage"></div>

<script>
(function(){
const S = SOIREE, H = S.horaires;
const ROM = ["I","II","III"];
const stage = document.getElementById("stage");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const heureGuest = i => H["guest"+(i+1)] || "";
const lieu = S.lieuxApero[S.apero] || S.lieuxApero.mele;

/* outils de composition */
const barres = (n, st="") => `<div class="barres" style="${st}">${"<i></i>".repeat(n)}</div>`;
const sceau = (txt, st="") => `<span class="sceau" style="${st}"><b>${esc(txt)}</b></span>`;
const lignes = nom => esc(nom).split(" ").reduce((acc,w,i,arr)=>{ // découpe le nom en deux lignes
  const mid = Math.ceil(arr.length/2); (i<mid?acc[0]:acc[1]).push(w); return acc;},[[],[]]).filter(l=>l.length).map(l=>l.join(" "));
const chrome = (droite=true) => `<div class="chrome"><span class="mot">GENIUS</span><span class="n7">N7</span></div>`
  + (droite ? `<div class="chrome-d">ENSEEIHT · ${esc(S.ville.toUpperCase())}</div>` : "");
const pied = (d="") => `<div class="pied"><span>GENIUS N7 · AIn7 · ${esc(S.dateCourte)}</span><span>${d}</span></div>`;
const gSvg = `<svg><use href="#g-ampoule"/></svg>`;
const org = esc(S.organisateurs).replace(/AIn7/g, '<span class="nt">AIn7</span>'); // AIn7 garde sa casse même en capitales
const visible = (g, moment) => g.nom && (!g.surprise || moment === "apres"); // nom montrable ?

/* ligne de programme : I · heure · nom ou scellé */
function ligneProg(g, i, moment){
  return `<div class="prog-ligne">${barres(i+1)}<span class="h num">${esc(heureGuest(i))}</span>`
    + (visible(g, moment) ? `<span class="nm" data-fit="${moment==='apres'?1500:880}">${esc(g.nom)}</span>` : sceau("Révélé sur scène"))
    + `</div>`;
}

const ecrans = [];
function ajoute(id, cls, html, opts={}){ ecrans.push(Object.assign({id, steps:1, trans:"noir", label:id}, opts));
  stage.insertAdjacentHTML("beforeend", `<section class="scr ${cls}" id="${id}">${html}</section>`); }

/* 01 · ATTENTE ------------------------------------------------------- */
const scelles = S.guests.filter(g => !visible(g,"avant")).length;
ajoute("attente","lumiere", `
  ${chrome()}
  <div class="plans">
    <div class="plan pA">
      <div class="sur">${esc(S.dateLongue)} · ${esc(S.lieu)}</div>
      <div class="titre"><span>Rencontres</span><span>Entrepreneuriat</span></div>
      <div class="rang">${barres(3)}
        <div class="t"><span class="sur">Trois actes · trois histoires</span><p>Ouverture <span class="num">${esc(H.ouverture)}</span></p></div></div>
    </div>
    <div class="plan pB">
      <div class="sur">Ce soir · trois actes</div>
      <div class="liste">${S.guests.map((g,i)=>ligneProg(g,i,"avant")).join("")}</div>
      ${scelles ? `<p class="note"><span>${scelles===1?"Un nom reste":(scelles===2?"Deux noms restent":"Trois noms restent")} sous scellé</span> jusqu’à ${scelles>1?"leur":"son"} entrée en scène.</p>` : ""}
    </div>
    <div class="plan pC">
      <div class="sur">Lever de rideau</div>
      <div class="grand num" id="cdGrand">${esc(H.ouverture)}</div>
      <p class="sous" id="cdSous">${esc(S.lieu)} · <span>${esc(S.ville)}</span></p>
    </div>
  </div>
  <div class="qr">
    <span class="sur">Scanne · inscris-toi</span>
    <div class="carre"><img src="img/qr-luma.svg" alt="QR code Luma"></div>
    <div class="url">${esc(S.luma)}</div>
  </div>
  <div class="progres"><i id="prog"></i></div>
  ${pied("ENSEEIHT · " + esc(S.ville.toUpperCase()))}
`, {label:"Attente (boucle)", trans:"noir"});

/* 02 · OUVERTURE ----------------------------------------------------- */
ajoute("ouverture","lumiere", `
  <div class="carre logoG">${gSvg}</div>
  <div class="credit"><div class="a">GENIUS N7 · AIn7</div><div class="b">PRÉSENTENT</div></div>
  <div class="t2">
    <div class="sur s1">${esc(S.titre)}</div>
    <div class="sur gris s2">${esc(S.dateLongue)} · ${esc(S.lieu)}</div>
    <div class="titre l l1"><span>Soirée</span></div>
    <div class="titre l l2"><span data-fit="1790">Entrepreneuriat</span></div>
    <div class="bas"><span class="regle"></span><p>Trois histoires qui se répondent.</p></div>
  </div>
  ${pied(esc(S.lieu.toUpperCase()))}
`, {steps:2, trans:"volet", label:"Ouverture"});

/* 03 · PROGRAMME ----------------------------------------------------- */
ajoute("programme","lumiere", `
  ${S.guests.map((g,i)=>`<div class="col" style="left:${72+i*640}px">
      ${barres(i+1)}
      <div class="sur">Acte ${ROM[i]}</div><div class="h num">${esc(heureGuest(i))}</div>
      ${visible(g,"avant") ? `<div class="nm">${lignes(g.nom).map(l=>`<span data-fit="520">${l}</span>`).join("")}</div>` : sceau("Révélé sur scène")}
    </div>`).join("")}
  <div class="bas"><p>Un show narratif, puis du réseau.</p><p class="num"><span>${esc(H.networking)}</span> · ${esc(lieu.nom)}</p></div>
  ${pied()}
`, {trans:"noir", label:"Programme"});

/* ACTES, FONDS, MERCI ------------------------------------------------ */
S.guests.forEach((g,i)=>{
  const n=i+1, x = 96 + n*110 + (n-1)*40 + 130, larg = 1920 - x - 96;
  const sc = !visible(g,"avant");     // arrive sous scellé
  const ls = g.nom ? lignes(g.nom) : [];
  ajoute("acte"+n, "acte " + (sc ? "scelle" : "direct"), `
    <div class="halo"></div>
    ${barres(n)}
    <div class="bloc" style="left:${x}px">
      <div class="sur">Acte ${ROM[i]}${g.nom ? `<span class="h num">· ${esc(heureGuest(i))}</span>` : ""}</div>
      ${g.nom ? `<div class="titre nom">${ls.map(l=>`<span><b data-fit="${larg}">${l}</b></span>`).join("")}</div>` : ""}
      ${g.nom ? `<div class="apres"><span class="regle"></span>${g.role?`<p>${esc(g.role)}</p>`:""}</div>` : ""}
      ${sc ? sceau(heureGuest(i), `width:${larg}px;height:${g.nom?Math.max(1,ls.length)*172+20:364}px`).replace('class="sceau"', 'class="sceau heure"') : ""}
    </div>
  `, {steps: (sc && g.nom) ? 2 : 1, trans:"volet", label:"Acte "+ROM[i]+" · entrée"+(g.nom?" ("+g.nom+")":"")});

  ajoute("fond"+n, "fond", `
    <div class="vide">${barres(n)}<div class="sur">Acte ${ROM[i]}</div></div>
    <img data-src="${esc(g.fond)}" alt="">
  `, {trans:"fondu", label:"Fond guest "+n+" ("+g.fond+")", fond:g.fond});

  const suiv = S.guests[i+1];
  const ensuite = suiv
    ? `<span class="sur">Ensuite · acte ${ROM[i+1]}</span>` + (visible(suiv,"avant") ? `<span class="x">${esc(suiv.nom)}</span>` : sceau(heureGuest(i+1)))
    : `<span class="sur">Ensuite</span><span class="x">La conversation continue · ${esc(lieu.nom)}</span>`;
  ajoute("merci"+n, "merci lumiere", `
    ${barres(n)}
    <div class="bloc" style="left:${x}px">
      <div class="sur">Fin de l’acte ${ROM[i]}</div>
      <div class="titre mot">Merci</div>
      <div class="qui" data-fit="${larg}">${g.nom ? esc(g.nom) : "Acte "+ROM[i]}</div>
      <div class="ensuite" style="width:${larg}px">${ensuite}</div>
    </div>
  `, {trans:"fondu", label:"Merci "+(g.nom||"guest "+n)});
});

/* CLÔTURE ------------------------------------------------------------ */
ajoute("cloture","lumiere", `
  ${chrome()}
  <div class="liste"><div class="sur" style="margin-bottom:34px">Ce soir · trois actes</div>${S.guests.map((g,i)=>ligneProg(g,i,"apres")).join("")}</div>
  <p class="phrase">Le spectacle s’arrête ici.</p>
  <div class="flood"></div>
  <div class="apres">
    <div class="chr">${chrome(false)}</div>
    <div class="sur">${org}</div>
    <div class="titre t"><span><b>La conversation</b></span><span><b data-fit="1790">commence.</b></span></div>
  </div>
`, {steps:2, trans:"noir", label:"Clôture"});

/* REMERCIEMENTS ------------------------------------------------------ */
ajoute("generique","creme", `
  ${chrome(false)}
  <div class="titre mot-merci">Merci</div>
  <div class="grille">
    <div><div class="sur">Sur scène</div>${S.guests.map((g,i)=> g.nom ? `<p>${esc(g.nom)}</p>` : `<p>Acte ${ROM[i]}</p>`).join("")}</div>
    <div><div class="sur">Organisation</div><p>Genius N7<small>avec AIn7</small></p></div>
    <div><div class="sur">Image &amp; lumière</div>${S.equipes.map(e=>`<p class="${e.logo?'avec-logo':''}">${e.logo?`<img class="eq-logo" src="${esc(e.logo)}" alt="" onerror="this.remove()">`:''}${esc(e.nom)}<small>${esc(e.role)}</small></p>`).join("")}</div>
    <div><div class="sur">Accueil</div><p>ENSEEIHT<small>${esc(S.lieu.split("·")[0].trim())} · ${esc(S.ville)}</small></p></div>
  </div>
  <div class="partenaires"><div class="sur">Partenaires</div>
    <div class="logos">${S.partenaires.map((p,i)=> p.logo
      ? `<div class="logo plein"><img src="${esc(p.logo)}" alt="${esc(p.nom)}"></div>`
      : `<div class="logo">Logo partenaire ${i+1}</div>`).join("")}</div></div>
  ${pied(esc(S.titre.toUpperCase()))}
`, {trans:"volet", label:"Remerciements"});

/* APÉRO -------------------------------------------------------------- */
ajoute("apero","creme", `
  ${chrome(false)}
  <div class="sur s1">La conversation continue</div>
  <svg class="fleche" viewBox="0 0 300 300"><path d="M30 150 H240 M168 72 L246 150 L168 228" fill="none" stroke="#0B0B0B" stroke-width="34" stroke-linecap="square"/></svg>
  <div class="titre lieu${lieu.nom.length>12?" deux":""}">${(lieu.nom.length>12 ? lignes(lieu.nom) : [esc(lieu.nom)]).map(l=>`<span><b data-fit="1440">${l}</b></span>`).join("")}</div>
  <div class="info"><i></i>${esc(S.aperoTexte)}${lieu.precision?` <i></i>${esc(lieu.precision)}`:""}</div>
  <div class="piste">${Array.from({length:8},(_,k)=>`<b style="animation-delay:${-k*0.6}s"></b>`).join("")}</div>
  ${pied(esc(S.titre.toUpperCase()))}
`, {trans:"noir", label:"Apéro (boucle) · " + lieu.nom});

/* surcouches */
stage.insertAdjacentHTML("beforeend", `<div id="volet"></div><div id="noir"></div><div id="grain"></div><div id="regie"></div>`);

/* ajustements après chargement de la police ---------------------------- */
function ajuste(){
  stage.querySelectorAll("[data-fit]").forEach(el=>{
    const max = +el.dataset.fit; el.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(el).fontSize);
    el.style.display = el.style.display || "inline-block";
    while (el.scrollWidth > max && fs > 20){ fs -= 2; el.style.fontSize = fs+"px"; }
  });
  // apéro : la flèche et le texte suivent la hauteur du nom du lieu
  const l = stage.querySelector("#apero .lieu"); if (l){ const h=l.offsetHeight; const t=326+h+44; stage.querySelector("#apero .info").style.top = t+"px"; stage.querySelector("#apero .piste").style.top = Math.max(880, t+130)+"px"; }
  // acte scellé avec nom connu : le scellé épouse le bloc du nom
  stage.querySelectorAll(".acte.scelle").forEach(a=>{ const nom=a.querySelector(".nom"), sc=a.querySelector(".sceau");
    if(nom&&sc){ const w=Math.max(...[...nom.querySelectorAll("b")].map(b=>b.offsetWidth)); sc.style.width=(w+40)+"px"; sc.style.height=(nom.offsetHeight+10)+"px"; }});
}

/* fonds des guests : affichés seulement si le fichier existe */
stage.querySelectorAll(".fond img").forEach(img=>{
  img.onload = ()=> img.closest(".fond").classList.add("a-image");
  img.onerror = ()=> img.closest(".fond").classList.remove("a-image");
  img.src = img.dataset.src;
});

/* mise à l'échelle 1920×1080 ------------------------------------------- */
let scale = 1;
function cadre(){ scale = location.search.includes("cap") ? 1 : Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(-50%,-50%) scale(${scale})`; stage.style.transformOrigin="50% 50%"; }
addEventListener("resize", cadre); cadre();

/* navigation ------------------------------------------------------------ */
let cur = -1, step = 0, enCours = false;
const el = i => stage.children[i];
function rejoue(node){ node.classList.remove("actif"); void node.offsetWidth; node.classList.add("actif"); }
function montre(i, s, anim=true){
  ecrans.forEach((e,k)=>{ if(k!==i) el(k).classList.remove("actif"); });
  const n = el(i); n.dataset.step = s;
  n.classList.toggle("sans-anim", !anim);
  rejoue(n);
  if(!anim) requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.remove("sans-anim")));
  cur = i; step = s;
  if (ecrans[i].id === "attente") demarreAttente(); else stopAttente();
  regie();
}
function va(i, s=0, anim=true){
  if (i<0 || i>=ecrans.length) return;
  const t = cur<0 ? "aucune" : ecrans[i].trans;
  if (t==="volet" && anim){
    const v=document.getElementById("volet"); v.classList.remove("passe"); void v.offsetWidth; v.classList.add("passe");
    setTimeout(()=>montre(i,s,anim), 430); setTimeout(()=>v.classList.remove("passe"), 1000);
  } else if ((t==="noir"||t==="fondu") && anim){
    const nr=document.getElementById("noir"); nr.style.transitionDuration = t==="fondu" ? ".7s" : ".45s"; nr.classList.add("on");
    setTimeout(()=>{ montre(i,s,anim); nr.classList.remove("on"); }, t==="fondu"?700:460);
  } else montre(i,s,anim);
}
function suivant(){
  if (step < ecrans[cur].steps-1){ step++; el(cur).dataset.step = step; regie(); return; }
  va(cur+1, 0);
}
function precedent(){
  if (step > 0){ step--; const n=el(cur); n.dataset.step = step; n.classList.add("sans-anim"); rejoue(n); requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.remove("sans-anim"))); regie(); return; }
  if (cur>0) va(cur-1, ecrans[cur-1].steps-1, false);
}
addEventListener("keydown", e=>{
  const k=e.key;
  if (["ArrowRight"," ","PageDown","ArrowDown","Enter"].includes(k)){ e.preventDefault(); if(!document.getElementById("noir").classList.contains("tenu")) suivant(); }
  else if (["ArrowLeft","PageUp","ArrowUp","Backspace"].includes(k)){ e.preventDefault(); precedent(); }
  else if (k==="Home") va(0,0);
  else if (k==="End") va(ecrans.length-1,0);
  else if (k==="f"||k==="F"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }
  else if (k==="r"||k==="R"){ document.getElementById("regie").classList.toggle("on"); regie(); }
  else if (k==="b"||k==="B"||k==="."){ const nr=document.getElementById("noir"); const on=!nr.classList.contains("tenu"); nr.classList.toggle("tenu",on); nr.classList.toggle("on",on); }
});

/* écran d'attente : plans en boucle + compte à rebours ------------------ */
let tPlan=null, tCd=null, plan=0, debutPlan=0, figePlan=null;
function montrePlan(p){
  const plans=[...stage.querySelectorAll("#attente .plan")];
  plans.forEach((x,k)=>{ x.classList.toggle("on",k===p); x.classList.toggle("off",k!==p && x.classList.contains("on")); });
  plan=p; debutPlan=performance.now();
}
function demarreAttente(){
  stopAttente(); montrePlan(figePlan ?? 0);
  const dur=S.attenteCycle*1000, bar=document.getElementById("prog");
  tPlan=setInterval(()=>{
    const r=(performance.now()-debutPlan)/dur; bar.style.width=Math.min(100,r*100)+"%";
    if(r>=1 && figePlan===null) montrePlan((plan+1)%3);
  }, 50);
  compte(); tCd=setInterval(compte, 1000);
}
function stopAttente(){ clearInterval(tPlan); clearInterval(tCd); }
function compte(){
  const g=document.getElementById("cdGrand"), so=document.getElementById("cdSous");
  const [hh,mm]=H.ouverture.split(":").map(Number);
  const cible=new Date(S.dateISO+"T00:00:00"); cible.setHours(hh,mm,0,0);
  const min=Math.ceil((cible-new Date())/60000);
  if (min>0 && min<=90){ g.innerHTML = `${min}<small>MIN</small>`; so.innerHTML = `Ouverture à <span class="num">${esc(H.ouverture)}</span> · ${esc(S.lieu)}`; }
  else { g.textContent = H.ouverture; so.innerHTML = `${esc(S.lieu)} · <span>${esc(S.ville)}</span>`; }
}

/* régie (touche R) ------------------------------------------------------ */
function regie(){
  const r=document.getElementById("regie"); if(!r.classList.contains("on")) return;
  const e=ecrans[cur], nx=ecrans[cur+1];
  let txt=`<em>${String(cur+1).padStart(2,"0")}/${ecrans.length}</em> &nbsp;${esc(e.label)}${e.steps>1?` &nbsp;<em>temps ${step+1}/${e.steps}</em>`:""}`
    + `<br>Suivant : ${nx?esc(nx.label):"—"}`;
  if (e.fond && !el(cur).classList.contains("a-image")) txt += `<br><em>Image absente :</em> déposer ${esc(e.fond)}`;
  txt += `<br><span style="color:#8d8d8d">→ / espace : suivant · ← : retour · B : noir · F : plein écran · R : masquer</span>`;
  r.innerHTML=txt;
}

/* démarrage : #n.s (écran.temps) et #n.s.p (plan d'attente figé) pour les répétitions */
function depuisHash(){
  const m=(location.hash.slice(1)||"1.1").split(".").map(Number);
  if (m[2]) figePlan = m[2]-1;
  if (location.search.includes("regie")) document.getElementById("regie").classList.add("on");
  va(Math.max(0,(m[0]||1)-1), Math.max(0,(m[1]||1)-1), true);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(()=>{ ajuste(); depuisHash(); });
})();
</script>
