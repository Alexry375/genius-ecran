:root { --ombre: #170b05; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
body.souris { cursor: default; }

#scene {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
  transform-origin: 0 0; background: #0c0705;
  font-family: "Garamond EB", Garamond, "Times New Roman", serif;
  font-variant-numeric: lining-nums; font-kerning: normal;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
}
.calque { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }

/* le mur du fond et la flaque de lumière de la servante */
#bain, #bain-braise { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
#bain-braise { opacity: 0; }

/* plein feu */
#plein-braise { opacity: 0; background: radial-gradient(ellipse 1400px 900px at 50% 40%, #c4621e 0%, #8a3a10 100%); will-change: opacity; }
#plein { opacity: 0; overflow: hidden; will-change: opacity;
  background: linear-gradient(135deg, #fedd74 0%, #f3cb6d 26%, #e6b866 50%, #d6a05c 75%, #c48751 100%); }
#chaud { position: absolute; left: -760px; top: -760px; width: 1520px; height: 1520px; will-change: transform;
  background: radial-gradient(circle closest-side at 50% 50%, rgba(255,248,226,.55) 0%, rgba(255,240,200,.24) 46%, rgba(255,232,180,0) 100%); }

/* le mur lui-même : bords dans l'ombre et grain de la toile (une seule image, mélange normal) */
#mur { background: url("images/mur.png") 0 0 / 1920px 1080px; will-change: opacity; }

/* les ombres : tout le texte de la soirée */
#ombres { overflow: visible; }
.o { position: absolute; left: 0; top: 0; white-space: nowrap; color: var(--ombre); opacity: 0; visibility: hidden;
     transform-origin: 0 0; will-change: transform, opacity; }
.o .m, .o .l { display: inline-block; }
.o.pendu::before, .o.pendu::after { content: ""; position: absolute; bottom: 100%; width: 1.5px; height: 1500px; background: currentColor; opacity: .62; }
.o.pendu::before { left: 7%; }
.o.pendu::after { right: 7%; }

.did    { font-style: italic; font-size: 100px; line-height: 1.06; font-weight: 540; }
.didm   { font-style: italic; font-size: 88px;  line-height: 1.06; font-weight: 540; }
.lieu   { font-style: italic; font-size: 88px;  line-height: 1.08; font-weight: 540; }
.tete   { font-style: italic; font-size: 62px;  line-height: 1.1;  font-weight: 540; }
.titre  { font-size: 150px; line-height: .93; font-weight: 560; letter-spacing: -.004em; }
.nom    { font-size: 150px; line-height: .9;  font-weight: 600; letter-spacing: .03em; }
.petit  { font-style: italic; font-size: 68px; line-height: 1.12; font-weight: 540; }
.dest   { font-size: 190px; line-height: .95; font-weight: 560; letter-spacing: -.004em; }

.acte   { font-size: 66px; line-height: 1; font-weight: 600; letter-spacing: .06em; font-variant-caps: all-small-caps; font-variant-numeric: lining-nums; }
.entre  { font-style: italic; font-size: 124px; line-height: 1; font-weight: 520; }
.nomp   { font-size: 252px; line-height: .88; font-weight: 620; letter-spacing: .01em; }
.rolep  { font-style: italic; font-size: 70px; line-height: 1.12; font-weight: 540; }

/* la servante */
#servante { will-change: transform; }
#poteau { position: absolute; width: 12px; border-radius: 6px;
  background: linear-gradient(90deg, #080403 0%, #26170d 40%, #3a2716 55%, #120a06 75%, #070302 100%); }
#douille { position: absolute; width: 64px; height: 42px; border-radius: 3px 3px 9px 9px;
  background:
    repeating-linear-gradient(180deg, rgba(255,226,170,.16) 0 2px, rgba(0,0,0,0) 2px 8px),
    linear-gradient(90deg, #0b0604 0%, #3b2617 38%, #5e4128 52%, #22150c 72%, #090503 100%); }
#halos { mix-blend-mode: screen; will-change: transform; }
.halo { position: absolute; width: 960px; height: 960px; will-change: opacity; }
#ampoule { position: absolute; width: 480px; height: 480px; overflow: visible; }

#voile { background: #000; opacity: 0; will-change: opacity; }

#aide { position: fixed; right: 18px; bottom: 18px; padding: 14px 18px; background: rgba(0,0,0,.85); color: #ecdcbc;
  font: 15px/1.55 system-ui, sans-serif; border: 1px solid #5a4630; border-radius: 6px; display: none; z-index: 9; cursor: default; }
#aide b { color: #fff; font-weight: 600; }
body.aide #aide { display: block; }
</style>
<script src="reglages.js"></script>
</head>
<body>
<div id="scene">
  <div id="bain"></div>
  <div id="bain-braise"></div>
  <div id="plein-braise" class="calque"></div>
  <div id="plein" class="calque"><div id="chaud"></div></div>
  <div id="mur" class="calque"></div>
  <div id="ombres" class="calque"></div>
  <div id="halos" class="calque">
    <img id="halo-braise" class="halo" src="images/halo-braise.png" alt="">
    <img id="halo-or" class="halo" src="images/halo-or.png" alt="">
  </div>
  <div id="servante" class="calque">
    <div id="poteau"></div>
    <div id="douille"></div>
    <svg id="ampoule" viewBox="-240 -240 480 480" role="img" aria-label="Genius N7">
      <defs><radialGradient id="g-verre" gradientUnits="userSpaceOnUse" cx="0" cy="-0.05" r="1.2">
        <stop id="sv0" offset="0" stop-color="#fff8ea"/><stop id="sv1" offset=".55" stop-color="#fff0d0"/><stop id="sv2" offset="1" stop-color="#f7c47a"/>
      </radialGradient></defs>
      <path id="verre" d="" fill="url(#g-verre)"/></svg>
  </div>
  <div id="voile" class="calque"></div>
</div>
<div id="aide"><b>→</b> ou <b>espace</b> : moment suivant<br><b>←</b> : moment précédent<br><b>0</b> l’attente, <b>1</b> <b>2</b> <b>3</b> les actes, <b>4</b> l’apéro<br><b>F</b> ou double-clic : plein écran<br><b>H</b> : cacher cette aide</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   LA SERVANTE — écran de la soirée entrepreneuriat Genius N7
   Les noms des guests et le lieu de l'apéro se règlent dans reglages.js.
   Rien à modifier dans ce fichier.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── réglages ───────────────────────────────────────────────────────── */
const REG = window.REGLAGES || {};
const propre = s => String(s || "").replace(/'/g, "’").replace(/\s+/g, " ").trim();
const GUESTS = [0, 1, 2].map(i => {
  const g = (REG.guests && REG.guests[i]) || {};
  return { nom: propre(g.nom), role: propre(g.role) };
});
const LIEU = propre(REG.apero) || "La Mêlée";
const INCONNU = "Quelqu’un";           /* le troisième, tant que son nom reste vide */

/* ── géométrie de la scène (1920 × 1080) ───────────────────────────── */
const W = 1920, H = 1080;
const BX = 520, BY = 392, RG = 185;   // centre et rayon du G-ampoule
const X0 = 860;                        // marge des textes à la lumière de la servante
const XA = 196;                        // marge des textes en plein feu
const PLX = 0.33;                      // les ombres glissent à l'opposé de la lampe
const LP = [960, 420];                 // d'où vient le plein feu (pour la profondeur)

const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sstep = (a, b, x) => { const u = seg(x, a, b); return u * u * (3 - 2 * u); };
const eOut = u => 1 - Math.pow(1 - clamp(u), 3);
const eIn = u => Math.pow(clamp(u), 3);
const eInOut = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const eOut5 = u => 1 - Math.pow(1 - clamp(u), 5);
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function bruit(t) { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }
function bosse(t, c, w) { const x = (t - c) / w; return Math.exp(-x * x); }

/* couleur du verre selon l'intensité : verre froid → braise → blanc chaud */
const RAMPE_VERRE = [[0, [40, 30, 24]], [.10, [78, 26, 9]], [.28, [156, 52, 14]], [.48, [226, 108, 30]],
  [.66, [248, 170, 66]], [.82, [255, 218, 146]], [1, [255, 244, 222]], [1.25, [255, 251, 242]]];
function rampe(R, I) {
  I = clamp(I, R[0][0], R[R.length - 1][0]);
  for (let k = 1; k < R.length; k++) if (I <= R[k][0]) {
    const [a, ca] = R[k - 1], [b, cb] = R[k], u = (I - a) / (b - a);
    return `rgb(${Math.round(lerp(ca[0], cb[0], u))},${Math.round(lerp(ca[1], cb[1], u))},${Math.round(lerp(ca[2], cb[2], u))})`;
  }
  const c = R[R.length - 1][1]; return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* ═══ la flaque de lumière sur le mur ═══════════════════════════════
   éclairement d'un mur par une lampe placée devant lui : (1 + (r/r0)²)^-1.5   */
const BAIN = { gauche: 1000, droite: 2700, haut: 430, bas: 730, r0: 1400, expo: 1.35 };
const RAMPE_MUR = [[0, [12, 7, 5]], [.1, [52, 28, 12]], [.2, [106, 60, 25]], [.33, [158, 96, 41]],
  [.5, [196, 128, 58]], [.75, [218, 152, 76]], [1, [228, 163, 88]], [1.3, [233, 170, 94]]];
/* quand la lampe baisse, le mur rougit (comme un filament qui refroidit) */
const RAMPE_BRAISE = [[0, [10, 5, 3]], [.1, [36, 12, 4]], [.25, [88, 28, 8]], [.45, [140, 48, 13]], [.7, [178, 68, 19]], [1, [198, 84, 25]]];
function construireBain() {
  const w = BAIN.gauche + BAIN.droite, h = BAIN.haut + BAIN.bas;
  for (const [id, R] of [["#bain", RAMPE_MUR], ["#bain-braise", RAMPE_BRAISE]]) {
    const b = $(id), stops = [];
    for (let r = 0; r <= 2900; r += 50) {
      const I = BAIN.expo * Math.pow(1 + (r / BAIN.r0) ** 2, -1.5);
      stops.push(`${rampe(R, I)} ${r}px`);
    }
    b.style.width = w + "px"; b.style.height = h + "px";
    b.style.left = (BX - BAIN.gauche) + "px"; b.style.top = (BY - BAIN.haut) + "px";
    b.style.background = `radial-gradient(circle at ${BAIN.gauche}px ${BAIN.haut}px, ${stops.join(",")})`;
  }
}

function texte(id, cls, x, y, lignes, opts = {}) {
  const el = document.createElement("div");
  el.className = "o " + cls + (opts.pendu ? " pendu" : "");
  lignes.forEach((ligne, k) => {
    if (k) el.appendChild(document.createElement("br"));
    ligne.split(" ").forEach((m, j) => {
      if (j) el.appendChild(document.createTextNode(" "));
      const s = document.createElement("span"); s.className = "m";
      if (opts.lettres) for (const ch of m) { const l = document.createElement("span"); l.className = "l"; l.textContent = ch; s.appendChild(l); }
      else s.textContent = m;
      el.appendChild(s);
    });
  });
  OMBRES.appendChild(el);
  items[id] = { el, x, y, w: 0, h: 0, plein: !!opts.plein, maxW: opts.maxW || 0, lettres: [], cache: {} };
  return items[id];
}

/* coupe une phrase en deux lignes si elle dépasse n caractères */
function coupe(s, n) {
  if (s.length <= n) return [s];
  const v = s.indexOf(", ");
  if (v > 0 && v + 1 <= n && s.length - v - 2 <= n) return [s.slice(0, v + 1), s.slice(v + 2)];
  const mots = s.split(" "); let best = null;
  for (let k = 1; k < mots.length; k++) {
    const a = mots.slice(0, k).join(" "), b = mots.slice(k).join(" "), sc = Math.max(a.length, b.length);
    if (!best || sc < best[0]) best = [sc, [a, b]];
  }
  return best ? best[1] : [s];
}
function deuxLignes(nom) {
  const p = nom.split(" ");
  if (p.length < 2) return [nom];
  let best = null;
  for (let k = 1; k < p.length; k++) {
    const a = p.slice(0, k).join(" "), b = p.slice(k).join(" ");
    const sc = Math.max(a.length, b.length) + (p[k - 1].length <= 3 ? 8 : 0);
    if (!best || sc < best[0]) best = [sc, [a, b]];
  }
  return best[1];
}

/* mesures, ajustements de taille, enchaînement vertical */
function mesurer() {
  for (const id in items) {
    const it = items[id];
    it.el.style.transform = `translate(${it.x}px,${it.y}px)`;
  }
  const taille = it => { it.w = it.el.offsetWidth; it.h = it.el.offsetHeight; };
  for (const id in items) taille(items[id]);
  /* trop large : on réduit le corps */
  for (const id in items) {
    const it = items[id];
    if (it.maxW && it.w > it.maxW) {
      const fs = parseFloat(getComputedStyle(it.el).fontSize);
      it.el.style.fontSize = (fs * it.maxW / it.w).toFixed(1) + "px";
      taille(it);
    }
  }
  const sous = (a, b, gap) => { if (items[a] && items[b]) { items[b].y = items[a].y + items[a].h + gap; } };
  sous("titre2", "titre3", 14);
  GUESTS.forEach((g, i) => sous("pnom" + i, "prole" + i, 26));
  sous("psalle", "prsalle", 26);
  sous("d2", "d2b", 30);
  sous("e1", "e2", 26); sous("e2", "e3", 2); sous("e3", "e4", 22);
  /* actes : le rôle doit rester au-dessus des fauteuils */
  GUESTS.forEach((g, i) => {
    const n = items["an" + i], r = items["ar" + i];
    if (!n || !r) return;
    for (let k = 0; k < 12; k++) {
      r.y = n.y + n.h + 22;
      if (r.y + r.h <= BAS_LISIBLE) break;
      const fs = parseFloat(getComputedStyle(n.el).fontSize);
      n.el.style.fontSize = (fs * .94).toFixed(1) + "px"; taille(n);
    }
  });
  for (const id in items) {
    const it = items[id];
    it.lettres = [...it.el.querySelectorAll(".l")].map((el, j) => ({ el, r: hash(j * 7.13 + 3.1), k: "" }));
  }
}

function montre(F, id, props) {
  if (!items[id]) return;
  const st = F.t[id] || (F.t[id] = { o: 1, dx: 0, dy: 0, p: 0, r: 0, sx: 1 });

/* ── les entrées en scène des ombres ─────────────────────────────────
   profondeur : l'objet passe tout près de la lampe — ombre immense et floue —
   puis se pose contre le mur, net.                                          */
function profondeur(F, id, t, a, b, din = 1.5, dout = 1.1, pmax = .6) {
  if (t < a || t > b) return;
  const u = eOut(seg(t, a, a + din)), v = eIn(seg(t, b - dout, b));
  montre(F, id, { p: pmax * (1 - u) + pmax * .9 * v, o: sstep(0, .55, seg(t, a, a + din)) * (1 - sstep(.25, 1, seg(t, b - dout, b))) });
}
/* cintres : descend des cintres au bout de ses fils, se balance, remonte */
function cintres(F, id, t, a, b, din = 1.9, dout = 1.2) {
  if (t < a || t > b) return;
  const it = items[id], haut = it.y + it.h + 40;
  const u = seg(t, a, a + din), v = eIn(seg(t, b - dout, b));
  const tl = t - (a + din * .82);
  const balan = tl > 0 ? Math.exp(-1.15 * tl) * Math.sin(tl * 2 * Math.PI / 2.4) : 0;
  montre(F, id, { dy: -haut * (1 - eOut(u)) - haut * v, r: 1.1 * balan, pivot: [it.x + it.w / 2, -900], o: 1 });
}
/* coulisses : entre par un côté (+1 = cour, à droite ; -1 = jardin, à gauche) */
function coulisse(F, id, t, a, b, de, vers, din = 1.6, dout = 1.3, arret = 0) {
  if (t < a || t > b) return;
  const it = items[id];
  const hors = s => s > 0 ? (W - it.x + 80) : -(it.x + it.w + 80);
  const u = eOut5(seg(t, a, a + din)), v = eIn(seg(t, b - dout, b));
  montre(F, id, { dx: lerp(hors(de), arret, u) + (hors(vers) - arret) * v, o: 1 });
}
/* vise : place le centre de l'ombre au point (sx, sy) de l'écran, à la profondeur p */
function vise(F, id, sx, sy, p, extra = {}) {
  const it = items[id], k = 1 / (1 - p), L = it.plein ? LP : [BX + F.servante.dx, BY];
  const par = it.plein ? 0 : -F.servante.dx * PLX;
  const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
  montre(F, id, Object.assign({ p, dx: (sx - par - L[0]) / k - cx + L[0], dy: (sy - L[1]) / k - cy + L[1] }, extra));
}
/* trappe : monte du dessous de la scène (de la salle) */
function trappe(F, id, t, a, b, din = 1.5, dout = 1.0) {
  if (t < a || t > b) return;
  const it = items[id], bas = H - it.y + 60;
  const u = eOut5(seg(t, a, a + din)), v = eIn(seg(t, b - dout, b));
  montre(F, id, { dy: bas * (1 - u) + bas * v, o: 1 });
}

/* ── la lampe ─────────────────────────────────────────────────────── */
function souffle(t) {
  return 1 + .022 * Math.sin(t * 2 * Math.PI / 5.3) + .012 * Math.sin(t * 2 * Math.PI / 2.1 + 1.3) + .025 * (bruit(t * 1.6) - .5);
}
function vacille(t, t0, f = 1) {
  const u = t - t0; if (u < -.1 || u > 1.3) return 1;
  const d = .55 * bosse(u, 0, .045) + .3 * bosse(u, .13, .035) + .75 * bosse(u, .34, .06) + .2 * bosse(u, .52, .04) + .38 * bosse(u, .86, .07);
  return 1 - clamp(d * f, 0, .92);
}
function allumage(t) {
  const u = seg(t, .3, ALLUMAGE);
  const base = u < .05 ? 0 : eInOut((u - .05) / .95);
  return base * (1 - .5 * bosse(u, .32, .03) - .3 * bosse(u, .5, .025)) * souffle(t);
}

/* ═══ MOMENT 0 — l'attente, en boucle ═══════════════════════════════ */
const ALLUMAGE = 3.0, CYCLE = 60;
const DIDAS = ["remplit", "cherche", "voisin", "fauteuils", "rang", "coulisses", "baisse"];

function attente(t, F) {
  F.servante.dx = 0;
  if (t < ALLUMAGE) { F.servante.I = allumage(t); return; }
  let I = souffle(t);
  const c = Math.floor((t - ALLUMAGE) / CYCLE), tc = (t - ALLUMAGE) - c * CYCLE;

  /* 0 – 9 : la page de titre se forme dans la lumière */
  profondeur(F, "titre1", tc, .2, 8.7);
  profondeur(F, "titre2", tc, .55, 8.9);
  profondeur(F, "titre3", tc, 1.1, 9.1);
  /* 9.4 – 17.4 : le lieu descend des cintres */
  cintres(F, "lieu", tc, 9.4, 17.4);
  /* 17.8 – 43 : les personnages */
  cintres(F, "perso", tc, 17.8, 43.0);
  for (let i = 0; i < 3; i++) I *= personnage(F, i, tc, 19.4 + i * 6.0);
  trappe(F, "psalle", tc, 37.4, 42.9);
  profondeur(F, "prsalle", tc, 38.3, 42.6, 1.2, .8, .45);
  /* 43.4 – 58.4 : deux didascalies, qui changent à chaque tour */
  I *= didascalie(F, DIDAS[(2 * c) % DIDAS.length], tc - 43.4);
  I *= didascalie(F, DIDAS[(2 * c + 1) % DIDAS.length], tc - 50.9);
  /* 58.4 – 60 : la lampe respire avant de recommencer */
  I *= 1 - .5 * Math.sin(Math.PI * seg(tc, 58.4, 60));
  F.servante.I = I;
}

function personnage(F, i, t, a) {
  const g = GUESTS[i], b = a + 5.6;
  if (g.nom) {
    coulisse(F, "pnom" + i, t, a, b, +1, -1, 1.7, 1.4);
    profondeur(F, "prole" + i, t, a + 1.1, b - .5, 1.2, .8, .45);
    return 1;
  }
  /* le troisième s'arrête dans les coulisses, à moitié hors du cadre ; la lampe frémit */
  const it = items["pnom" + i];
  const arret = (W - 30 - it.w * .88) - it.x;
  coulisse(F, "pnom" + i, t, a, b + .4, +1, +1, 2.4, 1.2, arret);
  const tau = t - (a + 2.4);
  if (F.t["pnom" + i] && tau > 0 && tau < 3.4) F.t["pnom" + i].dx += 95 * (1 - Math.cos(2 * Math.PI * tau / 1.7)) / 2;
  profondeur(F, "prole" + i, t, a + 1.6, b, 1.2, .9, .45);
  return vacille(t, a + 2.9, .8);
}

/* chaque didascalie a son jeu de scène ; renvoie un facteur pour la lampe */
function didascalie(F, nom, u) {
  const dur = 7.5;
  if (u < 0 || u > dur) return 1;
  switch (nom) {
    case "remplit": {                 /* chaque lettre prend sa place, au hasard */
      montre(F, "d0", { o: 1 - sstep(dur - .9, dur, u), p: .5 * eIn(seg(u, dur - .9, dur)), lettres: u });
      return 1;
    }
    case "cherche": {                 /* « Quelqu'un » erre, immense, puis s'assoit */
      const a = items.d1a, place = a.w + 18;
      profondeur(F, "d1b", u, 0, dur, 1.1, .9, .4);
      if (F.t.d1b) F.t.d1b.dx = lerp(0, place, eInOut(seg(u, 3.15, 3.7)));
      /* il longe le rang du dessus, de la cour vers la lampe, à petits pas… */
      const e = seg(u, .4, 3.6), x = sstep(0, 1, e), pas = Math.sin(Math.PI * 7 * e);
      /* …puis descend s'asseoir à sa place */
      const assis = eOut(seg(u, 3.68, 4.2)), rebond = 9 * bosse(u, 4.26, .09);
      montre(F, "d1a", {
        dx: (W + 60 - a.x) * (1 - x),
        dy: -(a.h + 40) * (1 - assis) - 14 * Math.abs(pas) * (1 - assis) + rebond,
        r: 2.4 * pas * (1 - assis), p: .07 * (1 - assis), o: 1,
      });
      if (u > dur - 1) montre(F, "d1a", { p: .4 * eIn(seg(u, dur - .9, dur)), dx: 0, dy: 0, r: 0, o: 1 - sstep(dur - .75, dur, u) });
      return 1;
    }
    case "voisin": {                  /* la phrase se tourne vers le voisin */
      profondeur(F, "d2", u, 0, dur, 1.3, .9, .5);
      profondeur(F, "d2b", u, 2.6, dur, 1.1, .9, .4);
      if (F.t.d2) {
        const tour = Math.sin(Math.PI * seg(u, 3.5, 5.3)) ** 2;
        F.t.d2.r = -5.5 * tour;
        F.t.d2.dx = 150 * tour;
        F.t.d2.dy = -18 * tour;
        F.t.d2.sx = 1 - .1 * tour;
      }
      return 1;
    }
    case "fauteuils": profondeur(F, "d3", u, 0, dur); return 1;
    case "rang": profondeur(F, "d4", u, 0, dur); return 1;
    case "coulisses": {               /* la phrase repart dans les coulisses */
      profondeur(F, "d5", u, 0, dur - 1.7);
      if (u > dur - 2.5) montre(F, "d5", { p: 0, o: 1, dx: eIn(seg(u, dur - 2.5, dur - .3)) * (W - X0 + 80) });
      return 1;
    }
    case "baisse": {                  /* la lumière obéit… un instant */
      profondeur(F, "d6", u, 0, dur);
      return 1 - .48 * sstep(1.9, 3.0, u) * (1 - sstep(4.6, 6.0, u));
    }
  }
  return 1;
}

/* sortie de l'attente : la lampe vacille et la servante est roulée en coulisses */
const SORTIE_ATTENTE = 2.0;
function attenteSortie(u, F) {
  const S = F.servante;
  S.I *= vacille(u, .02, 1) * (1 - sstep(1.45, 1.85, u));
  S.dx = -eIn(seg(u, .45, 1.85)) * 1150;
}

/* ═══ MOMENTS 1 – 3 — les actes, en plein feu ═══════════════════════ */
function acte(i, t, F) {
  const P = F.plein;
  P.P = eInOut(seg(t, .3, 1.25));
  const dt = Math.max(0, t - 1);
  P.hx = 520 + 260 * i + 150 * Math.sin(dt * .19) + 50 * Math.sin(dt * .47 + 1);
  P.hy = 330 + 70 * Math.sin(dt * .15 + 2) + 25 * Math.sin(dt * .37);
  P.P *= 1 + .012 * Math.sin(dt * .9) * sstep(1.5, 3, t);
  montre(F, "a" + i, { o: 1 });
  montre(F, "en" + i, { o: 1 });
  const n = "an" + i, r = "ar" + i;
  if (i === 0) coulisse(F, n, t, 1.25, 1e9, +1, +1, 1.9);          /* entre côté cour */
  else if (i === 1) coulisse(F, n, t, 1.25, 1e9, -1, -1, 1.9);     /* entre côté jardin */
  else profondeur(F, n, t, 1.15, 1e9, 2.3, 1, .66);                 /* entre par le fond */
  profondeur(F, r, t, 2.9, 1e9, 1.1, 1, .35);
}
const SORTIE_ACTE = 1.05;
function acteSortie(u, F) {
  F.plein.P *= 1 - eInOut(seg(u, 0, 1));
}

/* ═══ MOMENT 4 — épilogue ═══════════════════════════════════════════ */
function epilogue(t, F) {
  const S = F.servante;
  S.dx = -1150 * (1 - eOut(seg(t, .4, 2.5)));
  S.I = sstep(.55, 1.5, t) * (1 - .35 * bosse(t, .8, .05)) * souffle(t);
  montre(F, "e1", { o: 1 });
  profondeur(F, "e2", t, 2.3, 1e9, 1.0, 1, .4);
  profondeur(F, "e3", t, 2.6, 1e9, 1.6, 1, .6);
  profondeur(F, "e4", t, 3.6, 1e9, 1.1, 1, .4);
}

/* ═══ la régie ══════════════════════════════════════════════════════ */
const MOMENTS = [
  { rendre: attente,                sortie: attenteSortie, dSortie: SORTIE_ATTENTE, repos: ALLUMAGE },
  { rendre: (t, F) => acte(0, t, F), sortie: acteSortie,    dSortie: SORTIE_ACTE,    repos: 5 },
  { rendre: (t, F) => acte(1, t, F), sortie: acteSortie,    dSortie: SORTIE_ACTE,    repos: 5 },
  { rendre: (t, F) => acte(2, t, F), sortie: acteSortie,    dSortie: SORTIE_ACTE,    repos: 5 },
  { rendre: epilogue,               sortie: null,          dSortie: 0,              repos: 6 },
];
const capture = /[?&]capture/.test(location.search);
let courant = 0, debut = 0, sortie = null, voileDebut = -1e9, derniere = -1e9;

function suivant(now) {
  if (sortie || courant >= MOMENTS.length - 1) return;
  if (now - derniere < 900) return;
  derniere = now;
  sortie = { de: courant, debut: now, debutMoment: debut };
}
function precedent(now) { derniere = now; aller(Math.max(0, courant - 1), now); }
function aller(m, now) {
  sortie = null; courant = m;
  debut = now - MOMENTS[m].repos * 1000;
  voileDebut = now;
}
function image(now) {
  if (sortie && (now - sortie.debut) / 1000 >= MOMENTS[sortie.de].dSortie) {
    courant = sortie.de + 1; debut = now; sortie = null;
  }
  const F = etatVide();
  if (sortie) {
    MOMENTS[sortie.de].rendre((now - sortie.debutMoment) / 1000, F);
    MOMENTS[sortie.de].sortie((now - sortie.debut) / 1000, F);
  } else MOMENTS[courant].rendre((now - debut) / 1000, F);
  F.voile = Math.max(F.voile, 1 - seg((now - voileDebut) / 1000, 0, .6));
  appliquer(F, now / 1000);
}

/* ═══ application à la page ═════════════════════════════════════════ */
const E = {
  bain: $("#bain"), bainBraise: $("#bain-braise"), halos: $("#halos"), servante: $("#servante"), poteau: $("#poteau"), douille: $("#douille"),
  braise: $("#halo-braise"), or: $("#halo-or"), verre: $("#verre"), sv0: $("#sv0"), sv1: $("#sv1"), sv2: $("#sv2"),
  plein: $("#plein"), pleinBraise: $("#plein-braise"), chaud: $("#chaud"),
  mur: $("#mur"), voile: $("#voile"),
};
const memo = new WeakMap();
function pose(el, prop, val) {
  let c = memo.get(el); if (!c) { c = {}; memo.set(el, c); }
  if (c[prop] !== val) { c[prop] = val; el.style[prop] = val; }
}

function placerServante() {
  const bas = BY + 1.148 * RG;
  E.douille.style.left = (BX - 32) + "px"; E.douille.style.top = (bas + 2) + "px";
  E.poteau.style.left = (BX - 6) + "px"; E.poteau.style.top = (bas + 40) + "px"; E.poteau.style.height = (H - bas - 30) + "px";
  for (const el of [E.braise, E.or]) { el.style.left = (BX - 480) + "px"; el.style.top = (BY - 480) + "px"; }
  const amp = $("#ampoule"); amp.style.left = (BX - 240) + "px"; amp.style.top = (BY - 240) + "px";
  E.verre.setAttribute("d", LOGO);
  E.verre.setAttribute("transform", `scale(${RG})`);
}

const f2 = x => (Math.round(x * 100) / 100).toString();
function appliquer(F, ts) {
  /* la servante et sa lumière */
  const S = F.servante, I = Math.max(0, S.I), dx = S.dx;
  const tr = `translate3d(${f2(dx)}px,0,0)`;
  const absente = dx < -1300;
  pose(E.servante, "transform", tr);
  pose(E.halos, "transform", tr);
  pose(E.bain, "transform", tr);
  pose(E.bainBraise, "transform", tr);
  const Ic = clamp(I);
  const oA = Math.pow(Ic, 1.25), oB = (1 - oA) * sstep(0, .32, Ic) * .9;
  pose(E.bain, "opacity", f2(oA));
  pose(E.bain, "visibility", oA > .002 ? "visible" : "hidden");
  pose(E.bainBraise, "opacity", f2(oB));
  pose(E.bainBraise, "visibility", oB > .03 ? "visible" : "hidden");
  pose(E.servante, "visibility", absente ? "hidden" : "visible");
  pose(E.halos, "visibility", absente ? "hidden" : "visible");
  pose(E.sv0, "stopColor", rampe(RAMPE_VERRE, I * 1.12));
  pose(E.sv1, "stopColor", rampe(RAMPE_VERRE, I * .97));
  pose(E.sv2, "stopColor", rampe(RAMPE_VERRE, I * .8));
  const oo = sstep(.4, 1, I) * Math.min(I, 1.15), ob2 = sstep(0, .3, I) * (1 - sstep(.45, .95, I));
  pose(E.or, "opacity", f2(oo));
  pose(E.or, "visibility", oo > .005 ? "visible" : "hidden");
  pose(E.braise, "opacity", f2(ob2));
  pose(E.braise, "visibility", ob2 > .005 ? "visible" : "hidden");

  /* plein feu */
  const P = F.plein;
  const ob = sstep(0, .12, P.P) * (1 - sstep(.55, 1, P.P));
  pose(E.plein, "opacity", f2(clamp(P.P)));
  pose(E.plein, "visibility", P.P > .002 ? "visible" : "hidden");
  pose(E.pleinBraise, "opacity", f2(ob));
  pose(E.pleinBraise, "visibility", ob > .002 ? "visible" : "hidden");
  pose(E.mur, "opacity", f2(1 - .5 * clamp(P.P)));
  pose(E.chaud, "transform", `translate3d(${f2(P.hx)}px,${f2(P.hy)}px,0)`);

  /* les ombres */
  const Ls = [BX + dx, BY], par = -dx * PLX;
  for (const id in items) {
    const it = items[id], st = F.t[id], c = it.cache;
    if (!st || st.o <= .003) { if (c.vis !== 0) { c.vis = 0; it.el.style.visibility = "hidden"; it.el.style.opacity = "0"; c.o = "0"; } continue; }
    if (c.vis !== 1) { c.vis = 1; it.el.style.visibility = "visible"; }
    const p = clamp(st.p || 0, 0, .9), k = 1 / (1 - p);
    const L = it.plein ? LP : Ls, px = it.plein ? 0 : par;
    const ang = (st.r || 0) * Math.PI / 180, cs = Math.cos(ang), sn = Math.sin(ang), sx = st.sx === undefined ? 1 : st.sx;
    const piv = st.pivot || [it.x + it.w / 2, it.y + it.h / 2];
    /* A = k·R·S ; image d'un point P du texte au repos : L + k·(piv + R·S·(P − piv) + d − L) + parallaxe */
    const a = k * cs * sx, b = k * sn * sx, cc = -k * sn, d = k * cs;
    const rsPx = cs * sx * piv[0] - sn * piv[1], rsPy = sn * sx * piv[0] + cs * piv[1];
    const bx = L[0] + k * (piv[0] - rsPx + (st.dx || 0) - L[0]) + px;
    const by = L[1] + k * (piv[1] - rsPy + (st.dy || 0) - L[1]);
    const e = a * it.x + cc * it.y + bx, f = b * it.x + d * it.y + by;
    const m = `matrix(${a.toFixed(5)},${b.toFixed(5)},${cc.toFixed(5)},${d.toFixed(5)},${e.toFixed(2)},${f.toFixed(2)})`;
    if (c.m !== m) { c.m = m; it.el.style.transform = m; }
    const flou = .55 + 46 * p * p + 14 * p;
    const fl = flou < .6 ? "none" : `blur(${flou.toFixed(1)}px)`;
    if (c.f !== fl) { c.f = fl; it.el.style.filter = fl; }
    const o = f2(clamp(st.o) * (1 - .5 * p));
    if (c.o !== o) { c.o = o; it.el.style.opacity = o; }
    if (it.lettres.length) {
      for (const l of it.lettres) {
        let lo = 1, ly = 0;
        if (st.lettres !== undefined) {
          const t0 = .25 + l.r * 2.6, u = seg(st.lettres, t0, t0 + .3);
          lo = u; ly = -34 * (1 - eOut(u));
        }
        const key = lo.toFixed(2) + "|" + ly.toFixed(1);
        if (l.k !== key) { l.k = key; l.el.style.opacity = lo.toFixed(2); l.el.style.transform = `translateY(${ly.toFixed(1)}px)`; }
      }
    }
  }

  pose(E.voile, "opacity", f2(clamp(F.voile)));
  pose(E.voile, "visibility", F.voile > .002 ? "visible" : "hidden");
}

/* ═══ mise à l'échelle de la fenêtre ════════════════════════════════ */
function ajuster() {
  const k = Math.min(innerWidth / W, innerHeight / H), sc = $("#scene");
  sc.style.transform = `scale(${k})`;
  sc.style.left = ((innerWidth - W * k) / 2) + "px";
  sc.style.top = ((innerHeight - H * k) / 2) + "px";
}

/* ═══ clavier, souris ═══════════════════════════════════════════════ */
function pleinEcran() {
  if (!document.fullscreenElement) { const d = document.documentElement; d.requestFullscreen && d.requestFullscreen().catch(() => {}); }
  else document.exitFullscreen && document.exitFullscreen();
}
addEventListener("keydown", e => {
  if (e.repeat) return;
  const now = performance.now();
  if (["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) { e.preventDefault(); suivant(now); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); precedent(now); }
  else if (/^[0-4]$/.test(e.key)) aller(+e.key, now);
  else if (e.key === "f" || e.key === "F") pleinEcran();
  else if (e.key === "h" || e.key === "H" || e.key === "?") document.body.classList.toggle("aide");
});
addEventListener("dblclick", pleinEcran);
let minuteur = 0;
addEventListener("mousemove", () => {
  document.body.classList.add("souris"); clearTimeout(minuteur);
  minuteur = setTimeout(() => document.body.classList.remove("souris"), 1500);
});
addEventListener("resize", ajuster);

/* ═══ démarrage ═════════════════════════════════════════════════════ */
construireBain(); construire(); placerServante(); ajuster();
const polices = document.fonts && document.fonts.load
  ? Promise.all([document.fonts.load('560 100px "Garamond EB"'), document.fonts.load('italic 540 100px "Garamond EB"')]).catch(() => {})
  : Promise.resolve();
polices.then(() => {
  mesurer();
  if (capture) {
    /* pour fabriquer les captures : __aller(moment, t[, avancement de la sortie]) */
    window.__aller = (m, t, u) => {
      const F = etatVide();
      MOMENTS[m].rendre(t, F);
      if (u !== undefined && MOMENTS[m].sortie) MOMENTS[m].sortie(u, F);
      appliquer(F, t);
      return true;
    };
    window.__mesures = () => {
      const o = {};
      for (const id in items) { const it = items[id]; o[id] = [Math.round(it.x), Math.round(it.y), it.w, it.h, Math.round(it.x + it.w), Math.round(it.y + it.h)]; }
      return o;
    };
    window.__pret = true;
  } else {
    debut = performance.now();
    const boucle = now => { image(now); requestAnimationFrame(boucle); };
    requestAnimationFrame(boucle);
  }
});
</script>
</body>
